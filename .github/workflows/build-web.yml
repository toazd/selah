name: Build Web
env:
  FLUTTER_VERSION: '3.44.1'
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number (optional)'
        required: false
        type: string
        default: ''

jobs:
  extract-version:
    name: Extract App Version
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.extract.outputs.app_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract app version
        id: extract
        run: |
          APP_VERSION=$(grep "final appVersion" lib/main.dart | sed 's/.*= "\(.*\)".*/\1/')
          echo "app_version=$APP_VERSION" >> $GITHUB_OUTPUT
          echo "📋 App version: $APP_VERSION"

  build-web:
    name: Build Web App
    needs: extract-version
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Cache Flutter dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.flutter-cache
          ~/.pub-cache
        key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}
        restore-keys: |
          ${{ runner.os }}-flutter-

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'

    - name: Setup Node.js for web build
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Clean build
      run: flutter clean

    - name: Get flutter dependencies
      run: flutter pub get

    - name: Build Web release
      run: |
        flutter build web \
          --release \
          --target lib/main.dart \
          --dart-define=BUILD_NUMBER=${{ github.run_number }}

    - name: Create web build archive
      run: |
        mkdir -p build/artifacts
        cd build/web
        zip -r "../../build/artifacts/Selah-Web-${{ needs.extract-version.outputs.app_version }}.zip" .
        cd ../..
        ls -lah build/artifacts/

    - name: Upload Web artifact
      uses: actions/upload-artifact@v4
      with:
        name: selah-web-${{ needs.extract-version.outputs.app_version }}-${{ github.run_number }}
        path: build/artifacts/*
        if-no-files-found: error
