name: Build Linux App

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number (optional)'
        required: false
        type: string
        default: ''

jobs:
  build-linux:
    name: Build Linux App
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Cache Flutter dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.flutter-cache
          ~/.pub-cache
        key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}
        restore-keys: |
          ${{ runner.os }}-flutter-

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.38.5'
        channel: 'stable'

    - name: Extract app version
      run: |
        APP_VERSION=$(grep "final appVersion" lib/main.dart | sed 's/.*= "\(.*\)".*/\1/')
        echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV
        echo "📋 App version: $APP_VERSION"

    - name: Clean build
      run: flutter clean

    - name: Get flutter dependencies
      run: flutter pub get

    - name: Install Linux build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          clang \
          cmake \
          ninja-build \
          pkg-config \
          libgtk-3-dev \
          libblkid-dev \
          liblzma-dev

    - name: Build Linux release
      run: |
        flutter build linux \
          --release \
          --target lib/main.dart \
          --dart-define=BUILD_NUMBER=${{ github.run_number }}

    - name: Install packaging tools
      run: |
        sudo apt-get update
        sudo apt-get install -y ruby ruby-dev build-essential rpm
        sudo gem install fpm

    - name: Create packages
      run: |
        # Set package info
        APP_NAME="selah"
        VERSION="${{ env.APP_VERSION }}"
        BUILD_DIR="build/linux/x64/release/bundle"
        OUTPUT_DIR="build/packages"

        mkdir -p $OUTPUT_DIR

        # Create .tar.gz (generic Linux)
        echo "📦 Creating .tar.gz package..."
        cd $BUILD_DIR
        tar -czf "../../packages/Selah-${VERSION}.tar.gz" *
        cd ../../..

        # Create .deb package (Debian/Ubuntu)
        echo "📦 Creating .deb package..."
        fpm -s dir -t deb \
          -n $APP_NAME \
          -v $VERSION \
          --deb-priority optional \
          --category utils \
          --description "A cross-platform Bible study app using Flutter and the 1769 King James Version" \
          --url "https://github.com/toazd/selah" \
          --maintainer "Selah Team" \
          --license "Unlicense" \
          -p $OUTPUT_DIR \
          -C $BUILD_DIR \
          .

        # Create .rpm package (Red Hat/Fedora)
        echo "📦 Creating .rpm package..."
        fpm -s dir -t rpm \
          -n $APP_NAME \
          -v $VERSION \
          --rpm-os linux \
          --description "A cross-platform Bible study app using Flutter and the 1769 King James Version" \
          --url "https://github.com/toazd/selah" \
          --maintainer "Selah Team" \
          --license "Unlicense" \
          -p $OUTPUT_DIR \
          -C $BUILD_DIR \
          .

        echo "✅ All packages created in $OUTPUT_DIR"

    - name: List created packages
      run: ls -lah build/packages/

    - name: Upload Linux packages artifact
      uses: actions/upload-artifact@v4
      with:
        name: Selah-${{ env.APP_VERSION }}-${{ github.run_number }}
        path: build/packages/
        retention-days: 90

    - name: Build Summary
      run: |
        echo "## ✅ Linux Build Complete" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Build Details:**" >> $GITHUB_STEP_SUMMARY
        echo "- **Version:** Release Build" >> $GITHUB_STEP_SUMMARY
        echo "- **Build Number:** ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Platform:** Linux (x64)" >> $GITHUB_STEP_SUMMARY
        echo "- **Configuration:** Release" >> $GITHUB_STEP_SUMMARY
        echo "- **Backend:** Supabase" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**📦 Available Packages:**" >> $GITHUB_STEP_SUMMARY
        echo "- **.tar.gz:** Generic Linux (any distribution)" >> $GITHUB_STEP_SUMMARY
        echo "- **.deb:** Debian/Ubuntu compatible" >> $GITHUB_STEP_SUMMARY
        echo "- **.rpm:** Red Hat/Fedora compatible" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**📱 Installation Instructions:**" >> $GITHUB_STEP_SUMMARY
        echo "1. Download the appropriate package from the artifacts below" >> $GITHUB_STEP_SUMMARY
        echo "2. For .deb: \`sudo dpkg -i selah-${{ env.APP_VERSION }}.deb\`" >> $GITHUB_STEP_SUMMARY
        echo "3. For .rpm: \`sudo rpm -i selah-${{ env.APP_VERSION }}.rpm\`" >> $GITHUB_STEP_SUMMARY
        echo "4. For .tar.gz: Extract and run the executable" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**⚠️ Important Notes:**" >> $GITHUB_STEP_SUMMARY
        echo "- These are test builds for development purposes" >> $GITHUB_STEP_SUMMARY
        echo "- Supabase authentication and database will work with this build" >> $GITHUB_STEP_SUMMARY
        echo "- Desktop integration includes window management and file access" >> $GITHUB_STEP_SUMMARY
