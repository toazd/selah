name: Build Linux App

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number (optional)'
        required: false
        type: string
        default: ''

jobs:
  build-linux:
    name: Build Linux App
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Cache Flutter dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.flutter-cache
          ~/.pub-cache
        key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}
        restore-keys: |
          ${{ runner.os }}-flutter-

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.38.9'
        channel: 'stable'

    - name: Extract app version
      run: |
        APP_VERSION=$(grep "final appVersion" lib/main.dart | sed 's/.*= "\(.*\)".*/\1/')
        echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV
        echo "📋 App version: $APP_VERSION"

    - name: Clean build
      run: flutter clean

    - name: Get flutter dependencies
      run: flutter pub get

    - name: Install Linux build dependencies & packaging tools
      run: |
        sudo snap remove --purge firefox
        sudo apt-get purge -y firefox
        sudo rm -rf ~/snap/firefox
        sudo apt-get update
        sudo apt-get full-upgrade -y
        sudo apt-get install -y \
          clang \
          cmake \
          ninja-build \
          pkg-config \
          libgtk-3-dev \
          libblkid-dev \
          liblzma-dev \
          ruby \
          ruby-dev \
          build-essential \
          rpm
        sudo snap refresh
        sudo gem install fpm

    - name: Build Linux release
      run: |
        flutter build linux \
          --release \
          --target lib/main.dart \
          --dart-define=BUILD_NUMBER=${{ github.run_number }}

    - name: Create packages
      run: |
        # Set package info
        APP_NAME="selah"
        VERSION="${{ env.APP_VERSION }}"
        BUILD_DIR="build/linux/x64/release/bundle"
        OUTPUT_DIR="build/packages"

        mkdir -p "$OUTPUT_DIR"

        # Create .tar.gz (generic Linux)
        echo "📦 Creating .tar.gz package..."
        tar -czf "$OUTPUT_DIR/Selah-${VERSION}.tar.gz" -C "$BUILD_DIR" .

        # Create .deb package (Debian/Ubuntu)
        echo "📦 Creating .deb package..."
        # Copy bundle to temporary directory and reorganize for proper installation paths
        TEMP_DIR=$(mktemp -d)
        cp -r "$BUILD_DIR"/* "$TEMP_DIR/"
        
        # Create proper directory structure for installation
        mkdir -p "$TEMP_DIR/usr/bin"
        mkdir -p "$TEMP_DIR/usr/share/applications"
        mkdir -p "$TEMP_DIR/usr/share/icons/hicolor/256x256/apps"
        mkdir -p "$TEMP_DIR/opt/selah"
        
        # Copy icon BEFORE moving data directory
        if [ -f "$TEMP_DIR/data/flutter_assets/assets/icon.png" ]; then
          :
        else
          ls -lah "$TEMP_DIR/"
          ls -lah "$TEMP_DIR/data/"
          ls -lah "$TEMP_DIR/data/flutter_assets/"
          ls -lah "$TEMP_DIR/data/flutter_assets/assets/"
        fi

        cp "$TEMP_DIR/data/flutter_assets/assets/icon.png" "$TEMP_DIR/usr/share/icons/hicolor/256x256/apps/selah.png"

        # Move the entire Flutter bundle to /opt/selah
        # This preserves all relative paths that Flutter expects
        mv "$TEMP_DIR/selah" "$TEMP_DIR/opt/selah/"
        if [ -d "$TEMP_DIR/data" ]; then
          mv "$TEMP_DIR/data" "$TEMP_DIR/opt/selah/"
        fi
        if [ -d "$TEMP_DIR/lib" ]; then
          mv "$TEMP_DIR/lib" "$TEMP_DIR/opt/selah/"
        fi
        
        # Create symlink from /usr/bin/selah to the actual executable
        # This preserves Flutter's directory structure while allowing system-wide access
        ln -sf "/opt/selah/selah" "$TEMP_DIR/usr/bin/selah"
        
        # Create desktop file
        printf '[Desktop Entry]\nName=Selah\nComment=A cross-platform Bible study app using Flutter and the 1769 King James Version\nExec=/usr/bin/selah\nIcon=/usr/share/icons/hicolor/256x256/apps/selah.png\nType=Application\nCategories=Office;Education;\nKeywords=Bible;Study;KJV;\nStartupNotify=true\nStartupWMClass=com.selah.holybible\n' > "$TEMP_DIR/usr/share/applications/selah.desktop"
        
        fpm -s dir -t deb \
          -n "$APP_NAME" \
          -v "$VERSION" \
          --deb-priority optional \
          --category utils \
          --description "A cross-platform Bible study app using Flutter and the 1769 King James Version" \
          --url "https://github.com/toazd/selah" \
          --maintainer "Selah Team" \
          --license "Unlicense" \
          -p "$OUTPUT_DIR" \
          -C "$TEMP_DIR" \
          usr/bin/selah \
          usr/share/applications/selah.desktop \
          usr/share/icons/ \
          opt/selah/ \
          
        # Cleanup temp directory
        rm -rf "$TEMP_DIR"

        # Create .rpm package (Red Hat/Fedora)
        echo "📦 Creating .rpm package..."
        # Use similar structure for RPM
        TEMP_DIR=$(mktemp -d)
        cp -r "$BUILD_DIR"/* "$TEMP_DIR/"
        
        mkdir -p "$TEMP_DIR/usr/bin"
        mkdir -p "$TEMP_DIR/usr/share/applications"
        mkdir -p "$TEMP_DIR/usr/share/icons/hicolor/256x256/apps"
        mkdir -p "$TEMP_DIR/opt/selah"
        
        # Copy icon BEFORE moving data directory
        cp "$TEMP_DIR/data/flutter_assets/assets/icon.png" "$TEMP_DIR/usr/share/icons/hicolor/256x256/apps/selah.png"
        
        # Move the entire Flutter bundle to /opt/selah
        # This preserves all relative paths that Flutter expects
        mv "$TEMP_DIR/selah" "$TEMP_DIR/opt/selah/"
        if [ -d "$TEMP_DIR/data" ]; then
          mv "$TEMP_DIR/data" "$TEMP_DIR/opt/selah/"
        fi
        if [ -d "$TEMP_DIR/lib" ]; then
          mv "$TEMP_DIR/lib" "$TEMP_DIR/opt/selah/"
        fi
        
        # Create symlink from /usr/bin/selah to the actual executable
        # This preserves Flutter's directory structure while allowing system-wide access
        ln -sf "/opt/selah/selah" "$TEMP_DIR/usr/bin/selah"
        
        printf '[Desktop Entry]\nName=Selah\nComment=A cross-platform Bible study app using Flutter and the 1769 King James Version\nExec=/usr/bin/selah\nIcon=/usr/share/icons/hicolor/256x256/apps/selah.png\nType=Application\nCategories=Office;Education;\nKeywords=Bible;Study;KJV;\nStartupNotify=true\nStartupWMClass=com.selah.holybible\n' > "$TEMP_DIR/usr/share/applications/selah.desktop"
        
        fpm -s dir -t rpm \
          -n "$APP_NAME" \
          -v "$VERSION" \
          --rpm-os linux \
          --description "A cross-platform Bible study app using Flutter and the 1769 King James Version" \
          --url "https://github.com/toazd/selah" \
          --maintainer "Selah Team" \
          --license "Unlicense" \
          -p "$OUTPUT_DIR" \
          -C "$TEMP_DIR" \
          usr/bin/selah \
          usr/share/applications/selah.desktop \
          usr/share/icons/ \
          opt/selah/ \
          
        rm -rf "$TEMP_DIR"

        echo "✅ All packages created in $OUTPUT_DIR"

    - name: List created packages
      run: ls -lah build/packages/

    - name: Create Release and Upload Packages
      uses: softprops/action-gh-release@v1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        tag_name: linux-v${{ env.APP_VERSION }}-build.${{ github.run_number }}
        name: Linux Release - ${{ env.APP_VERSION }} (Build ${{ github.run_number }})
        draft: false
        prerelease: false
        files: build/packages/*

    - name: Build Summary
      run: |
        echo "## ✅ Linux Build Complete" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Build Details:**" >> $GITHUB_STEP_SUMMARY
        echo "- **Version:** Release Build (${{ env.APP_VERSION }})" >> $GITHUB_STEP_SUMMARY
        echo "- **Build Number:** ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Platform:** Linux (x64)" >> $GITHUB_STEP_SUMMARY
        echo "- **Configuration:** Release" >> $GITHUB_STEP_SUMMARY
        echo "- **Backend:** Supabase" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**📦 Available Packages:**" >> $GITHUB_STEP_SUMMARY
        echo "- **.tar.gz:** Generic Linux (any distribution)" >> $GITHUB_STEP_SUMMARY
        echo "- **.deb:** Debian/Ubuntu compatible" >> $GITHUB_STEP_SUMMARY
        echo "- **.rpm:** Red Hat/Fedora compatible" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**📥 Download from GitHub Release:**" >> $GITHUB_STEP_SUMMARY
        echo "All packages have been uploaded to the [GitHub Release](https://github.com/toazd/selah/releases/tag/linux-v${{ env.APP_VERSION }}-build.${{ github.run_number }}) for this build." >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**📱 Installation Instructions:**" >> $GITHUB_STEP_SUMMARY
        echo "1. Download the appropriate package from the GitHub Release" >> $GITHUB_STEP_SUMMARY
        echo "2. For .deb: \`sudo dpkg -i selah-${{ env.APP_VERSION }}.deb\`" >> $GITHUB_STEP_SUMMARY
        echo "3. For .rpm: \`sudo rpm -i selah-${{ env.APP_VERSION }}.rpm\`" >> $GITHUB_STEP_SUMMARY
        echo "4. For .tar.gz: Extract and run the executable" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**⚠️ Important Notes:**" >> $GITHUB_STEP_SUMMARY
        echo "- These are test builds for development purposes" >> $GITHUB_STEP_SUMMARY
        echo "- Supabase authentication and database will work with this build" >> $GITHUB_STEP_SUMMARY
        echo "- Desktop integration includes window management and file access" >> $GITHUB_STEP_SUMMARY
