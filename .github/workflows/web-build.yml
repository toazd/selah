name: Build Web App

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number (optional)'
        required: false
        type: string
        default: ''

jobs:
  build-web:
    name: Build Web App
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Cache Flutter dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.flutter-cache
          ~/.pub-cache
        key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}
        restore-keys: |
          ${{ runner.os }}-flutter-

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.38.9'
        channel: 'stable'

    - name: Extract app version
      run: |
        APP_VERSION=$(grep "final appVersion" lib/main.dart | sed 's/.*= "\(.*\)".*/\1/')
        echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV
        echo "📋 App version: $APP_VERSION"

    - name: Setup Node.js for web build
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Clean build
      run: flutter clean

    - name: Get flutter dependencies
      run: flutter pub get

    - name: Build Web release
      run: |
        flutter build web \
          --release \
          --target lib/main.dart \
          --dart-define=BUILD_NUMBER=${{ github.run_number }}

    - name: List web build contents
      run: |
        echo "🌐 Web build contents:"
        ls -la build/web/
        echo ""
        echo "Build size:"
        du -sh build/web/

    - name: Create web build archive
      run: |
        mkdir -p build/artifacts
        cd build/web
        zip -r "../../build/artifacts/Selah-Web-${{ env.APP_VERSION }}.zip" .
        cd ../..
        echo "✅ Web archive created: build/artifacts/Selah-Web-${{ env.APP_VERSION }}.zip"
        ls -lah build/artifacts/

    - name: Create Release and Upload Web Build
      uses: softprops/action-gh-release@v1
      with:
        tag_name: web-v${{ env.APP_VERSION }}-build.${{ github.run_number }}
        name: Web Release - ${{ env.APP_VERSION }} (Build ${{ github.run_number }})
        draft: false
        prerelease: false
        files: build/artifacts/Selah-Web-${{ env.APP_VERSION }}.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Build Summary
      run: |
        echo "## ✅ Web Build Complete" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Build Details:**" >> $GITHUB_STEP_SUMMARY
        echo "- **Version:** Release Build (${{ env.APP_VERSION }})" >> $GITHUB_STEP_SUMMARY
        echo "- **Build Number:** ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Platform:** Web (HTML/CSS/JS)" >> $GITHUB_STEP_SUMMARY
        echo "- **Configuration:** Release" >> $GITHUB_STEP_SUMMARY
        echo "- **Backend:** Supabase" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**📥 Download from GitHub Release:**" >> $GITHUB_STEP_SUMMARY
        echo "The web build archive has been uploaded to the [GitHub Release](https://github.com/toazd/selah/releases/tag/web-v${{ env.APP_VERSION }}-build.${{ github.run_number }})." >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**📦 Build Output:**" >> $GITHUB_STEP_SUMMARY
        echo "- **Archive:** Selah-Web-${{ env.APP_VERSION }}.zip (ready for deployment)" >> $GITHUB_STEP_SUMMARY
        echo "- **Main File:** index.html" >> $GITHUB_STEP_SUMMARY
        echo "- **Includes:** All assets, fonts, and compiled JavaScript" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**🚀 Deployment Instructions:**" >> $GITHUB_STEP_SUMMARY
        echo "**For Local Testing:**" >> $GITHUB_STEP_SUMMARY
        echo "1. Download the web build archive from the GitHub Release" >> $GITHUB_STEP_SUMMARY
        echo "2. Extract the contents" >> $GITHUB_STEP_SUMMARY
        echo "3. Serve with any static web server:" >> $GITHUB_STEP_SUMMARY
        echo "   - Python: \`python -m http.server 8000\`" >> $GITHUB_STEP_SUMMARY
        echo "   - Node: \`npx serve .\`" >> $GITHUB_STEP_SUMMARY
        echo "   - PHP: \`php -S localhost:8000\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**For Electron Packaging:**" >> $GITHUB_STEP_SUMMARY
        echo "1. Extract the archive contents to your electron app folder" >> $GITHUB_STEP_SUMMARY
        echo "2. Run \`npm run make\` as usual" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**⚠️ Important Notes:**" >> $GITHUB_STEP_SUMMARY
        echo "- These are test builds for development purposes" >> $GITHUB_STEP_SUMMARY
        echo "- Supabase authentication and database will work with this build" >> $GITHUB_STEP_SUMMARY
        echo "- Web build includes PWA capabilities" >> $GITHUB_STEP_SUMMARY
        echo "- SQLite database uses WebAssembly (sqflite_common_ffi_web)" >> $GITHUB_STEP_SUMMARY
        echo "- Ensure web server supports history API fallback for routing" >> $GITHUB_STEP_SUMMARY
