name: Build Android App

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number (optional)'
        required: false
        type: string
        default: ''

jobs:
  build-android:
    name: Build Android App
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Cache Flutter dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.flutter-cache
          ~/.pub-cache
        key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}
        restore-keys: |
          ${{ runner.os }}-flutter-

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.38.9'
        channel: 'stable'

    - name: Extract app version
      run: |
        APP_VERSION=$(grep "final appVersion" lib/main.dart | sed 's/.*= "\(.*\)".*/\1/')
        echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV
        echo "📋 App version: $APP_VERSION"

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept Android licenses
      run: yes | flutter doctor --android-licenses

    - name: Clean build
      run: flutter clean

    - name: Get flutter dependencies
      run: flutter pub get

    - name: Build Android APK
      run: |
        flutter build apk \
          --release \
          --target lib/main.dart \
          --dart-define=BUILD_NUMBER=${{ github.run_number }}

    - name: Rename APK artifact
      run: |
        mkdir -p build/artifacts
        cp build/app/outputs/flutter-apk/app-release.apk "build/artifacts/Selah-${{ env.APP_VERSION }}.apk"

    - name: List APK files
      run: |
        echo "📱 APK files created:"
        find build/ -name "*.apk" -type f -exec ls -la {} \;
        echo ""
        echo "📦 Final artifact:"
        ls -la build/artifacts/

    - name: Create Release and Upload APK
      uses: softprops/action-gh-release@v1
      with:
        tag_name: android-v${{ env.APP_VERSION }}-build.${{ github.run_number }}
        name: Android Release - ${{ env.APP_VERSION }} (Build ${{ github.run_number }})
        draft: false
        prerelease: false
        files: build/artifacts/Selah-${{ env.APP_VERSION }}.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Build Summary
      run: |
        echo "## ✅ Android Build Complete" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Build Details:**" >> $GITHUB_STEP_SUMMARY
        echo "- **Version:** Release Build (${{ env.APP_VERSION }})" >> $GITHUB_STEP_SUMMARY
        echo "- **Build Number:** ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Platform:** Android" >> $GITHUB_STEP_SUMMARY
        echo "- **Configuration:** Release" >> $GITHUB_STEP_SUMMARY
        echo "- **Backend:** Supabase" >> $GITHUB_STEP_SUMMARY
        echo "- **Min SDK:** 22 (Android 5.1+)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**📥 Download from GitHub Release:**" >> $GITHUB_STEP_SUMMARY
        echo "The APK has been uploaded to the [GitHub Release](https://github.com/toazd/selah/releases/tag/android-v${{ env.APP_VERSION }}-build.${{ github.run_number }})." >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**📦 Available Package:**" >> $GITHUB_STEP_SUMMARY
        echo "- **APK:** Selah-${{ env.APP_VERSION }}.apk (Universal Android package)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**📱 Installation Instructions:**" >> $GITHUB_STEP_SUMMARY
        echo "**Option 1 - Direct APK Install:**" >> $GITHUB_STEP_SUMMARY
        echo "1. Download the APK file from the GitHub Release" >> $GITHUB_STEP_SUMMARY
        echo "2. Transfer to your Android device" >> $GITHUB_STEP_SUMMARY
        echo "3. Enable 'Install from Unknown Sources' in settings" >> $GITHUB_STEP_SUMMARY
        echo "4. Open the APK file and install" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Option 2 - ADB Install:**" >> $GITHUB_STEP_SUMMARY
        echo "1. Connect Android device with USB debugging enabled" >> $GITHUB_STEP_SUMMARY
        echo "2. Download APK and run: \`adb install Selah-${{ env.APP_VERSION }}.apk\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**⚠️ Important Notes:**" >> $GITHUB_STEP_SUMMARY
        echo "- These are test builds for development purposes" >> $GITHUB_STEP_SUMMARY
        echo "- Supabase authentication and database will work with this build" >> $GITHUB_STEP_SUMMARY
        echo "- App requires Android 5.1 or higher" >> $GITHUB_STEP_SUMMARY
        echo "- Enable 'Install unknown apps' permission for your browser/file manager" >> $GITHUB_STEP_SUMMARY
        echo "- If installation fails, check device storage and try restarting the device" >> $GITHUB_STEP_SUMMARY
