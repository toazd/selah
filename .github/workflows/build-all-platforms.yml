name: Build All Platforms
env:
  FLUTTER_VERSION: '3.44.2'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number (optional)'
        required: false
        type: string
        default: ''

jobs:
  extract-version:
    name: Extract App Version
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.extract.outputs.app_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Extract app version
        id: extract
        run: |
          APP_VERSION=$(grep "final appVersion" lib/main.dart | sed 's/.*= "\(.*\)".*/\1/')
          echo "app_version=$APP_VERSION" >> $GITHUB_OUTPUT
          echo "📋 App version: $APP_VERSION"

  build-linux:
    name: Build Linux App
    needs: extract-version
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Cache Flutter dependencies
      uses: actions/cache@v5
      with:
        path: |
          ~/.flutter-cache
          ~/.pub-cache
        key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}
        restore-keys: |
          ${{ runner.os }}-flutter-

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'

    - name: Clean build
      run: flutter clean

    - name: Get flutter dependencies
      run: flutter pub get

    - name: Install Linux build dependencies & packaging tools
      run: |
        sudo apt-get update
        sudo apt-get full-upgrade -y
        sudo apt-get install -y \
          clang \
          cmake \
          ninja-build \
          pkg-config \
          libgtk-3-dev \
          libgirepository1.0-dev \
          librsvg2-dev \
          libblkid-dev \
          liblzma-dev \
          dpkg-dev \
          file \
          ruby \
          ruby-dev \
          build-essential \
          rpm \
          flatpak \
          flatpak-builder \
          libfuse2 \
          wget
        sudo snap refresh
        sudo gem install fpm

    - name: Build Linux release
      run: |
        flutter build linux \
          --release \
          --target lib/main.dart \
          --dart-define=BUILD_NUMBER=${{ github.run_number }}

    - name: Create packages
      run: |
        APP_NAME="selah"
        VERSION="${{ needs.extract-version.outputs.app_version }}"
        BUILD_DIR="build/linux/x64/release/bundle"
        OUTPUT_DIR="$(pwd)/build/packages"

        mkdir -p "$OUTPUT_DIR"

        echo "📦 Creating .tar.gz package..."
        tar -czf "$OUTPUT_DIR/Selah-${VERSION}.tar.gz" -C "$BUILD_DIR" .

        echo "📦 Creating .deb package..."
        TEMP_DIR=$(mktemp -d)
        cp -r "$BUILD_DIR"/* "$TEMP_DIR/"
        mkdir -p "$TEMP_DIR/usr/bin"
        mkdir -p "$TEMP_DIR/usr/share/applications"
        mkdir -p "$TEMP_DIR/usr/share/icons/hicolor/256x256/apps"
        mkdir -p "$TEMP_DIR/opt/selah"

        cp "$TEMP_DIR/data/flutter_assets/assets/icon.png" "$TEMP_DIR/usr/share/icons/hicolor/256x256/apps/io.github.toazd.selah.png"
        mv "$TEMP_DIR/selah" "$TEMP_DIR/opt/selah/"
        if [ -d "$TEMP_DIR/data" ]; then
          mv "$TEMP_DIR/data" "$TEMP_DIR/opt/selah/"
        fi
        if [ -d "$TEMP_DIR/lib" ]; then
          mv "$TEMP_DIR/lib" "$TEMP_DIR/opt/selah/"
        fi

        ln -sf "/opt/selah/selah" "$TEMP_DIR/usr/bin/selah"
        printf '[Desktop Entry]\nName=Selah\nComment=A cross-platform Bible study app using Flutter and the 1769 King James Version\nExec=/usr/bin/selah\nIcon=io.github.toazd.selah.png\nType=Application\nCategories=Education\nKeywords=Bible;Study;KJV;\nStartupNotify=true\nStartupWMClass=io.github.toazd.selah\n' > "$TEMP_DIR/usr/share/applications/io.github.toazd.selah.desktop"

        fpm -s dir -t deb \
          -n "$APP_NAME" \
          -v "$VERSION" \
          --deb-priority optional \
          --category utils \
          --description "A cross-platform Bible study app using Flutter and the 1769 King James Version" \
          --url "https://github.com/toazd/selah" \
          --maintainer "Selah Team" \
          --license "Unlicense" \
          -p "$OUTPUT_DIR" \
          -C "$TEMP_DIR" \
          usr/bin/selah \
          usr/share/applications/io.github.toazd.selah.desktop \
          usr/share/icons/ \
          opt/selah/
        rm -rf "$TEMP_DIR"

        echo "📦 Creating .rpm package..."
        TEMP_DIR=$(mktemp -d)
        cp -r "$BUILD_DIR"/* "$TEMP_DIR/"
        mkdir -p "$TEMP_DIR/usr/bin"
        mkdir -p "$TEMP_DIR/usr/share/applications"
        mkdir -p "$TEMP_DIR/usr/share/icons/hicolor/256x256/apps"
        mkdir -p "$TEMP_DIR/opt/selah"

        cp "$TEMP_DIR/data/flutter_assets/assets/icon.png" "$TEMP_DIR/usr/share/icons/hicolor/256x256/apps/io.github.toazd.selah.png"
        mv "$TEMP_DIR/selah" "$TEMP_DIR/opt/selah/"
        if [ -d "$TEMP_DIR/data" ]; then
          mv "$TEMP_DIR/data" "$TEMP_DIR/opt/selah/"
        fi
        if [ -d "$TEMP_DIR/lib" ]; then
          mv "$TEMP_DIR/lib" "$TEMP_DIR/opt/selah/"
        fi

        ln -sf "/opt/selah/selah" "$TEMP_DIR/usr/bin/selah"
        printf '[Desktop Entry]\nName=Selah\nComment=A cross-platform Bible study app using Flutter and the 1769 King James Version\nExec=/usr/bin/selah\nIcon=io.github.toazd.selah.png\nType=Application\nCategories=Education\nKeywords=Bible;Study;KJV;\nStartupNotify=true\nStartupWMClass=io.github.toazd.selah\n' > "$TEMP_DIR/usr/share/applications/io.github.toazd.selah.desktop"

        fpm -s dir -t rpm \
          -n "$APP_NAME" \
          -v "$VERSION" \
          --iteration "${{ github.run_number }}" \
          --rpm-os linux \
          --description "A cross-platform Bible study app using Flutter and the 1769 King James Version" \
          --url "https://github.com/toazd/selah" \
          --maintainer "Selah Team" \
          --license "Unlicense" \
          -p "$OUTPUT_DIR" \
          -C "$TEMP_DIR" \
          usr/bin/selah \
          usr/share/applications/io.github.toazd.selah.desktop \
          usr/share/icons/ \
          opt/selah/
        rm -rf "$TEMP_DIR"

        echo "📦 Creating AppImage package..."
        APPIMAGE_WORK=$(mktemp -d)
        APPDIR="$APPIMAGE_WORK/Selah.AppDir"
        LINUXDEPLOY="$APPIMAGE_WORK/linuxdeploy-x86_64.AppImage"
        GTK_PLUGIN="$APPIMAGE_WORK/linuxdeploy-plugin-gtk.sh"
        DESKTOP_FILE="$APPIMAGE_WORK/io.github.toazd.selah.desktop"
        ICON_FILE="$APPIMAGE_WORK/io.github.toazd.selah.png"

        # Flutter resolves data/ and its own libraries relative to the executable,
        # so keep the complete release bundle together under usr/bin. linuxdeploy
        # adds the discovered system libraries under usr/lib and creates AppRun.
        mkdir -p "$APPDIR/usr/bin"
        cp -a "$BUILD_DIR/." "$APPDIR/usr/bin/"
        cp "$BUILD_DIR/data/flutter_assets/assets/icon.png" "$ICON_FILE"
        printf '[Desktop Entry]\nName=Selah\nComment=A cross-platform Bible study app using Flutter and the 1769 King James Version\nExec=selah\nIcon=io.github.toazd.selah\nType=Application\nCategories=Education\nKeywords=Bible;Study;KJV;\nStartupNotify=true\nStartupWMClass=io.github.toazd.selah\n' > "$DESKTOP_FILE"

        # Pin and verify the packaging tools instead of executing mutable
        # continuous-build downloads directly.
        wget -q -O "$LINUXDEPLOY" "https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage"
        wget -q -O "$GTK_PLUGIN" "https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/3b67a1d1c1b0c8268f57f2bce40fe2d33d409cea/linuxdeploy-plugin-gtk.sh"
        printf '%s  %s\n' 'c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d' "$LINUXDEPLOY" | sha256sum --check -
        printf '%s  %s\n' 'b0f4cbc684a0103a9651f0955b635eaea0096b3a66c0f5a2c2aa337960375171' "$GTK_PLUGIN" | sha256sum --check -
        chmod +x "$LINUXDEPLOY" "$GTK_PLUGIN"

        export APPIMAGE_EXTRACT_AND_RUN=1
        export DEPLOY_GTK_VERSION=3
        export LDAI_OUTPUT="$OUTPUT_DIR/Selah-${VERSION}.AppImage"
        export NO_STRIP=1
        "$LINUXDEPLOY" \
          --appdir "$APPDIR" \
          --executable "$APPDIR/usr/bin/selah" \
          --desktop-file "$DESKTOP_FILE" \
          --icon-file "$ICON_FILE" \
          --plugin gtk \
          --output appimage

        # Confirm that dependency deployment occurred and the generated image is
        # structurally runnable without mounting it through FUSE.
        test -e "$APPDIR/usr/lib/libgtk-3.so.0"
        test -e "$APPDIR/usr/lib/libglib-2.0.so.0"
        BUNDLED_LIBRARY_COUNT=$(find "$APPDIR/usr/lib" -type f -name '*.so*' | wc -l)
        echo "Bundled $BUNDLED_LIBRARY_COUNT shared libraries into the AppImage"
        EXTRACT_DIR="$APPIMAGE_WORK/extracted"
        mkdir -p "$EXTRACT_DIR"
        (
          cd "$EXTRACT_DIR"
          APPIMAGE_EXTRACT_AND_RUN= "$LDAI_OUTPUT" --appimage-extract > /dev/null
        )
        test -x "$EXTRACT_DIR/squashfs-root/AppRun"
        test -x "$EXTRACT_DIR/squashfs-root/usr/bin/selah"
        test -e "$EXTRACT_DIR/squashfs-root/usr/lib/libgtk-3.so.0"
        rm -rf "$APPIMAGE_WORK"

        echo "📦 Creating Flatpak package..."
        TEMP_DIR3=$(mktemp -d)
        cp -r "$BUILD_DIR"/* "$TEMP_DIR3/"
        mkdir -p "$TEMP_DIR3/opt/selah" "$TEMP_DIR3/usr/share/icons/hicolor/256x256/apps" "$TEMP_DIR3/usr/share/applications"
        cp "$TEMP_DIR3/data/flutter_assets/assets/icon.png" "$TEMP_DIR3/usr/share/icons/hicolor/256x256/apps/selah.png"
        mv "$TEMP_DIR3/selah" "$TEMP_DIR3/opt/selah/"
        if [ -d "$TEMP_DIR3/data" ]; then
          mv "$TEMP_DIR3/data" "$TEMP_DIR3/opt/selah/"
        fi
        if [ -d "$TEMP_DIR3/lib" ]; then
          mv "$TEMP_DIR3/lib" "$TEMP_DIR3/opt/selah/"
        fi

        # Create desktop file for Flatpak
        mkdir -p "$TEMP_DIR3/usr/share/applications"
        printf '[Desktop Entry]\nName=Selah\nComment=A cross-platform Bible study app using Flutter and the 1769 King James Version\nExec=selah\nIcon=io.github.toazd.selah\nType=Application\nCategories=Education\nKeywords=Bible;Study;KJV;\nStartupNotify=true\nStartupWMClass=io.github.toazd.selah\n' > "$TEMP_DIR3/usr/share/applications/io.github.toazd.selah.desktop"

        # Prepare minimal flatpak manifest and build tree
        FLATPAK_BUILD="$TEMP_DIR3/flatpak-build"
        mkdir -p "$FLATPAK_BUILD/opt/selah" "$FLATPAK_BUILD/usr/share/icons/hicolor/256x256/apps" "$FLATPAK_BUILD/usr/share/applications"
        cp -r "$TEMP_DIR3/opt/selah/"* "$FLATPAK_BUILD/opt/selah/"
        if [ -f "$TEMP_DIR3/usr/share/applications/io.github.toazd.selah.desktop" ]; then
          cp "$TEMP_DIR3/usr/share/applications/io.github.toazd.selah.desktop" "$FLATPAK_BUILD/usr/share/applications/"
        fi
        cp "$TEMP_DIR3/usr/share/icons/hicolor/256x256/apps/selah.png" "$FLATPAK_BUILD/usr/share/icons/hicolor/256x256/apps/io.github.toazd.selah.png"
        # Copy LICENSE file for Flathub compliance
        cp LICENSE "$FLATPAK_BUILD/" || true

        MANIFEST="$TEMP_DIR3/io.github.toazd.selah.json"
        cat > "$MANIFEST" <<JSON
        {
          "app-id": "io.github.toazd.selah",
          "runtime": "org.freedesktop.Platform",
          "runtime-version": "25.08",
          "sdk": "org.freedesktop.Sdk",
          "command": "selah",
          "branch": "$VERSION",
          "finish-args": [
              "--socket=wayland",
              "--socket=fallback-x11",
              "--device=dri",
              "--share=ipc",
              "--share=network",
              "--talk-name=org.freedesktop.secrets",
              "--filesystem=xdg-config/selah:create",
              "--socket=system-bus",
              "--talk-name=org.freedesktop.NetworkManager"
            ],
          "modules": [
            {
              "name": "selah-bundle",
              "buildsystem": "simple",
              "build-commands": [
                "install -d /app/bin",
                "install -D -m755 opt/selah/selah /app/bin/selah",
                "cp -r opt/selah/lib /app/bin/",
                "cp -r opt/selah/data /app/bin/",
                "install -D -m644 usr/share/applications/io.github.toazd.selah.desktop /app/share/applications/io.github.toazd.selah.desktop",
                "install -D -m644 usr/share/icons/hicolor/256x256/apps/io.github.toazd.selah.png /app/share/icons/hicolor/256x256/apps/io.github.toazd.selah.png",
                "install -Dm0644 LICENSE $FLATPAK_DEST/share/licenses/$FLATPAK_ID/selah-bundle/LICENSE"
              ],
              "sources": [
                {
                  "type": "dir",
                  "path": "flatpak-build"
                }
              ]
            }
          ]
        }
        JSON

        cd "$TEMP_DIR3"
        flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
        flatpak-builder --user --force-clean --arch=x86_64 --repo=repo --install-deps-from=flathub build-dir "$MANIFEST"
        flatpak build-bundle repo "$OUTPUT_DIR/selah-${VERSION}.flatpak" io.github.toazd.selah "$VERSION"
        sync
        cd - || true
        rm -rf "$TEMP_DIR3" || true

        ls -lah build/packages/
        ls -lah "$OUTPUT_DIR"

    - name: Upload Linux packages artifact
      uses: actions/upload-artifact@v6
      with:
        name: linux-packages
        path: build/packages

    - name: Upload Linux to Release
      uses: softprops/action-gh-release@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        tag_name: v${{ needs.extract-version.outputs.app_version }}-build.${{ github.run_number }}
        name: Selah v${{ needs.extract-version.outputs.app_version }} - Build ${{ github.run_number }}
        draft: false
        prerelease: false
        files: build/packages/*
        body: |
          # Selah Release v${{ needs.extract-version.outputs.app_version }}
          ## Build #${{ github.run_number }}

          ## 📦 Installation files by Platform
          Selah is not currently available in any app stores so some platforms require manual installation.

          ### 🪟 Windows
          - `Selah-Windows-${{ needs.extract-version.outputs.app_version }}.exe`
            - Windows installer (recommended; includes Start Menu and Desktop shortcuts, easy uninstall)
          - `Selah-Windows-${{ needs.extract-version.outputs.app_version }}.zip`
            - Windows portable archive (x64) - (unzip anywhere and run selah.exe; no installation required)

          ### 🐧 Arch / CachyOS / Manjaro Linux
          - Automated - Any AUR helper (eg. `paru -S selah-bin`)
          - Manual - `makepkg -sirc` after cloning `https://aur.archlinux.org/selah-bin.git`

          ### 🐧 Linux Other
          - Generic x86_64 - (unpack and run from anywhere)
            - `Selah-${{ needs.extract-version.outputs.app_version }}.tar.gz`
          - Debian / Ubuntu
            - `selah-${{ needs.extract-version.outputs.app_version }}-*.deb`
            - `sudo dpkg -i ./Selah-X.X.X.deb`
          - Red Hat / Fedora
            - `selah-${{ needs.extract-version.outputs.app_version }}-*.rpm`
            - `sudo dnf install ./Selah-X.X.X.rpm` (NOTE: rpms are not signed)
          - AppImage
            - `Selah-${{ needs.extract-version.outputs.app_version }}.AppImage`
            - `chmod +x Selah-X.X.X.AppImage; ./Selah-X.X.X.AppImage` (NOTE: you may need to install `fuse2`)
          - Flatpak
            - `selah-${{ needs.extract-version.outputs.app_version }}.flatpak`
            - `flatpak install ./Selah-X.X.X.flatpak`
          - Snap
            - `Selah-${{ needs.extract-version.outputs.app_version }}.snap`
            - `snap install --dangerous ./Selah-X.X.X.snap`

          ### 🤖 Android & ChromeOS
          - Universal Android app
            - `Selah-${{ needs.extract-version.outputs.app_version }}.apk`
              - `adb install ./Selah-X.X.X.apk` or install on the device.

          ### 🍎 iOS
          - iOS app
            - Unsigned for sideloading (Sideloadly)
            - `Selah-${{ needs.extract-version.outputs.app_version }}-${{ github.run_number }}.ipa`

          ### 🍎 macOS
          - Disk image installer
            - Untested builds. Need feedback!
            - `Selah-${{ needs.extract-version.outputs.app_version }}.dmg`

          ### 🌐 Web
          - Web build archive
            - `Selah-Web-0.7.5.zip`
            - Requires a real web server (extract to server root).
            - https://toazd.github.io/bible

  build-snap:
    name: Build Snap Package
    needs:
      - extract-version
      - build-linux
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Download Linux package artifacts
      uses: actions/download-artifact@v8
      with:
        name: linux-packages
        path: build/packages

    - name: Prepare Snap build directory and copy icon
      run: |
        mkdir -p build/snap-build
        cp snapcraft/io.github.toazd.selah.svg build/snap-build/

    - name: Install snapcraft dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y snapd squashfs-tools dpkg-dev
        sudo snap install core22
        sudo snap install snapcraft --classic

    - name: Extract Debian package for Snap build
      run: |
        set -e
        mkdir -p build/snap-build/prime
        mkdir -p build/snap-build/snap/gui
        DEB_FILE=$(ls build/packages/selah_*.deb | head -n1)
        if [ -z "$DEB_FILE" ]; then
          echo "❌ Debian package not found"
          ls -lah build/packages
          exit 1
        fi
        dpkg-deb -x "$DEB_FILE" build/snap-build/prime
        mkdir -p build/snap-build/prime/usr/share/applications
        mkdir -p build/snap-build/prime/usr/share/icons/hicolor/256x256/apps
        # Copy icon to snap/gui directory for snapcraft
        cp build/snap-build/io.github.toazd.selah.svg build/snap-build/snap/gui/
        printf '[Desktop Entry]\nName=Selah\nComment=A cross-platform Bible study app using Flutter and the 1769 King James Version\nExec=selah\nIcon=${SNAP}/meta/gui/io.github.toazd.selah.svg\nType=Application\nCategories=Education\nKeywords=Bible;Study;KJV;\nStartupNotify=true\nStartupWMClass=io.github.toazd.selah\n' > build/snap-build/snap/gui/io.github.toazd.selah.desktop

    - name: Create Snapcraft manifest
      run: |
        VERSION="${{ needs.extract-version.outputs.app_version }}"
        cat > build/snap-build/snapcraft.yaml <<EOF
        name: selah
        title: Selah Bible study app
        version: $VERSION
        summary: Cross platform Bible study app
        license: Unlicense
        contact: wmcdannell@gmail.com
        issues: https://github.com/toazd/selah/issues
        website: https://toazd.github.io/
        icon: snap/gui/io.github.toazd.selah.svg
        type: app
        description: |
          A cross-platform Bible study app using Flutter and the 1769 King James Version.
        base: core22
        confinement: strict
        grade: stable
        apps:
          selah:
            command: opt/selah/selah
            desktop: snap/gui/io.github.toazd.selah.desktop
            environment:
              __EGL_VENDOR_LIBRARY_DIRS: \$SNAP/usr/share/glvnd/egl_vendor.d
              LIBGL_DRIVERS_PATH: \$SNAP/usr/lib/x86_64-linux-gnu/dri
              GTK_PATH: \$SNAP/usr/lib/x86_64-linux-gnu/gtk-3.0
            plugs:
              - personal-files
              - home
              - network
              - network-bind
              - network-manager-observe
              - network-observe
              - pulseaudio
              - audio-playback
              - removable-media
              - x11
              - wayland
              - desktop
              - desktop-legacy
              - browser-support
              - opengl
        plugs:
          personal-files:
            read:
              - \$HOME/.config/selah
            write:
              - \$HOME/.config/selah
        parts:
          selah:
            plugin: dump
            source: prime
            organize:
              snap/gui/io.github.toazd.selah.svg: snap/gui/io.github.toazd.selah.svg
            stage-packages:
              - ca-certificates
              - libgtk-3-0
              - libglib2.0-0
              - libpango-1.0-0
              - libpangocairo-1.0-0
              - libgdk-pixbuf2.0-0
              - libx11-6
              - libx11-xcb1
              - libxkbcommon0
              - libdrm2
              - libegl1
              - libegl-mesa0
              - libgbm1
              - libgl1
              - libgl1-mesa-dri
              - libgles2
              - libglvnd0
              - libglx0
              - libglx-mesa0
              - libopengl0
              - libfontconfig1
              - libfreetype6
              - libcanberra-gtk-module
              - libcanberra-gtk3-module
              - libsecret-1-0
              - libsqlite3-0
              - libopus0
              - libjsoncpp25
              - libasound2
              - libatk1.0-0
              - libc6
              - libxcb1
              - libxcb-dri2-0
              - libxcb-dri3-0
              - libxcb-glx0
              - libxcb-present0
              - libxcb-randr0
              - libxcb-sync1
              - libxcb-xfixes0
              - libxrender1
              - libxrandr2
              - libxss1
              - libxcursor1
              - libxcomposite1
              - libxdamage1
              - libxfixes3
              - libxext6
              - libxinerama1
              - libxshmfence1
              - libxtst6
              - libwayland-client0
              - libwayland-cursor0
              - libwayland-egl1
              - libgdk-pixbuf2.0-0
              - xdg-utils
        EOF

    - name: Build Snap package
      run: |
        cd build/snap-build
        sudo snapcraft pack --destructive-mode --output ../packages
        cd -
        SNAP_FILE=""
        for file in build/packages/*.snap; do
          if [ -f "$file" ]; then
            SNAP_FILE="$file"
            break
          fi
        done
        if [ -z "$SNAP_FILE" ]; then
          echo "❌ Snap package not found"
          ls -lah build/packages
          exit 1
        fi
        SNAP_TARGET="build/packages/Selah-${{ needs.extract-version.outputs.app_version }}.snap"
        if [ "$SNAP_FILE" != "$SNAP_TARGET" ]; then
          mv "$SNAP_FILE" "$SNAP_TARGET"
        fi
        ls -lah build/packages

    - name: Upload Snap to Release
      uses: softprops/action-gh-release@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        tag_name: v${{ needs.extract-version.outputs.app_version }}-build.${{ github.run_number }}
        name: Selah v${{ needs.extract-version.outputs.app_version }} - Build ${{ github.run_number }}
        draft: false
        prerelease: false
        files: build/packages/*.snap

  build-web:
    name: Build Web App
    needs: extract-version
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Cache Flutter dependencies
      uses: actions/cache@v5
      with:
        path: |
          ~/.flutter-cache
          ~/.pub-cache
        key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}
        restore-keys: |
          ${{ runner.os }}-flutter-

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'

    - name: Setup Node.js for web build
      uses: actions/setup-node@v6
      with:
        node-version: '18'

    - name: Clean build
      run: flutter clean

    - name: Get flutter dependencies
      run: flutter pub get

    - name: Build Web release
      run: |
        flutter build web \
          --release \
          --target lib/main.dart \
          --dart-define=BUILD_NUMBER=${{ github.run_number }} \
          --wasm

    - name: Create web build archive
      run: |
        mkdir -p build/artifacts
        cd build/web
        zip -r "../../build/artifacts/Selah-Web-${{ needs.extract-version.outputs.app_version }}.zip" .
        cd ../..
        ls -lah build/artifacts/

    - name: Upload Web to Release
      uses: softprops/action-gh-release@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        tag_name: v${{ needs.extract-version.outputs.app_version }}-build.${{ github.run_number }}
        name: Selah v${{ needs.extract-version.outputs.app_version }} - Build ${{ github.run_number }}
        draft: false
        prerelease: false
        files: build/artifacts/*

  build-android:
    name: Build Android App
    needs: extract-version
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Cache Flutter dependencies
      uses: actions/cache@v5
      with:
        path: |
          ~/.flutter-cache
          ~/.pub-cache
        key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}
        restore-keys: |
          ${{ runner.os }}-flutter-

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'

    - name: Setup Java JDK
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4

    - name: Accept Android licenses
      run: yes | flutter doctor --android-licenses

    - name: Clean build
      run: flutter clean

    - name: Get flutter dependencies
      run: flutter pub get


    - name: Create release keystore (for signing)
      run: |
        if [ -f android/app/selah-release.keystore ]; then
          echo "Keystore already exists"
        else
          echo "Generating selah-release.keystore for CI signing"
          keytool -genkeypair -v \
            -keystore android/app/selah-release.keystore \
            -storepass '2Samuel22:33' \
            -alias selah-key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keypass '2Samuel22:33' \
            -dname "CN=CI, OU=CI, O=Selah, L=CI, ST=CI, C=US"
        fi

    - name: Build Android APK
      run: |
        flutter build apk \
          --release \
          --target lib/main.dart \
          --dart-define=BUILD_NUMBER=${{ github.run_number }}

    - name: Rename APK artifact
      run: |
        mkdir -p build/artifacts
        cp build/app/outputs/flutter-apk/app-release.apk "build/artifacts/Selah-${{ needs.extract-version.outputs.app_version }}.apk"
        ls -lah build/artifacts/

    - name: Upload Android to Release
      uses: softprops/action-gh-release@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        tag_name: v${{ needs.extract-version.outputs.app_version }}-build.${{ github.run_number }}
        name: Selah v${{ needs.extract-version.outputs.app_version }} - Build ${{ github.run_number }}
        draft: false
