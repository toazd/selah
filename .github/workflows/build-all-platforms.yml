name: Build All Platforms
env:
  FLUTTER_VERSION: '3.44.3'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number (optional)'
        required: false
        type: string
        default: ''

jobs:
  extract-version:
    name: Extract App Version
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.extract.outputs.app_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Extract app version
        id: extract
        run: |
          APP_VERSION=$(grep "final appVersion" lib/main.dart | sed 's/.*= "\(.*\)".*/\1/')
          echo "app_version=$APP_VERSION" >> $GITHUB_OUTPUT
          echo "📋 App version: $APP_VERSION"

  build-linux:
    name: Build Linux App
    needs: extract-version
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Cache Flutter dependencies
      uses: actions/cache@v5
      with:
        path: |
          ~/.flutter-cache
          ~/.pub-cache
        key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}
        restore-keys: |
          ${{ runner.os }}-flutter-

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'

    - name: Clean build
      run: flutter clean

    - name: Get flutter dependencies
      run: flutter pub get

    - name: Install Linux build dependencies & packaging tools
      run: |
        sudo apt-get update
        sudo apt-get full-upgrade -y
        sudo apt-get install -y \
          clang \
          cmake \
          ninja-build \
          pkg-config \
          libgtk-3-dev \
          libblkid-dev \
          liblzma-dev \
          ruby \
          ruby-dev \
          build-essential \
          rpm \
          flatpak \
          flatpak-builder \
          libfuse2 \
          wget
        sudo snap refresh
        sudo gem install fpm

    - name: Build Linux release
      run: |
        flutter build linux \
          --release \
          --target lib/main.dart \
          --dart-define=BUILD_NUMBER=${{ github.run_number }}

    - name: Create packages
      run: |
        APP_NAME="selah"
        VERSION="${{ needs.extract-version.outputs.app_version }}"
        BUILD_DIR="build/linux/x64/release/bundle"
        OUTPUT_DIR="$(pwd)/build/packages"

        mkdir -p "$OUTPUT_DIR"

        echo "📦 Creating .tar.gz package..."
        tar -czf "$OUTPUT_DIR/Selah-${VERSION}.tar.gz" -C "$BUILD_DIR" .

        echo "📦 Creating .deb package..."
        TEMP_DIR=$(mktemp -d)
        cp -r "$BUILD_DIR"/* "$TEMP_DIR/"
        mkdir -p "$TEMP_DIR/usr/bin"
        mkdir -p "$TEMP_DIR/usr/share/applications"
        mkdir -p "$TEMP_DIR/usr/share/icons/hicolor/256x256/apps"
        mkdir -p "$TEMP_DIR/opt/selah"

        cp "$TEMP_DIR/data/flutter_assets/assets/icon.png" "$TEMP_DIR/usr/share/icons/hicolor/256x256/apps/io.github.toazd.selah.png"
        mv "$TEMP_DIR/selah" "$TEMP_DIR/opt/selah/"
        if [ -d "$TEMP_DIR/data" ]; then
          mv "$TEMP_DIR/data" "$TEMP_DIR/opt/selah/"
        fi
        if [ -d "$TEMP_DIR/lib" ]; then
          mv "$TEMP_DIR/lib" "$TEMP_DIR/opt/selah/"
        fi

        ln -sf "/opt/selah/selah" "$TEMP_DIR/usr/bin/selah"
        printf '[Desktop Entry]\nName=Selah\nComment=A cross-platform Bible study app using Flutter and the 1769 King James Version\nExec=/usr/bin/selah\nIcon=io.github.toazd.selah.png\nType=Application\nCategories=Education\nKeywords=Bible;Study;KJV;\nStartupNotify=true\nStartupWMClass=io.github.toazd.selah\n' > "$TEMP_DIR/usr/share/applications/io.github.toazd.selah.desktop"

        fpm -s dir -t deb \
          -n "$APP_NAME" \
          -v "$VERSION" \
          --deb-priority optional \
          --category utils \
          --description "A cross-platform Bible study app using Flutter and the 1769 King James Version" \
          --url "https://github.com/toazd/selah" \
          --maintainer "Selah Team" \
          --license "Unlicense" \
          -p "$OUTPUT_DIR" \
          -C "$TEMP_DIR" \
          usr/bin/selah \
          usr/share/applications/io.github.toazd.selah.desktop \
          usr/share/icons/ \
          opt/selah/
        rm -rf "$TEMP_DIR"

        echo "📦 Creating .rpm package..."
        TEMP_DIR=$(mktemp -d)
        cp -r "$BUILD_DIR"/* "$TEMP_DIR/"
        mkdir -p "$TEMP_DIR/usr/bin"
        mkdir -p "$TEMP_DIR/usr/share/applications"
        mkdir -p "$TEMP_DIR/usr/share/icons/hicolor/256x256/apps"
        mkdir -p "$TEMP_DIR/opt/selah"

        cp "$TEMP_DIR/data/flutter_assets/assets/icon.png" "$TEMP_DIR/usr/share/icons/hicolor/256x256/apps/io.github.toazd.selah.png"
        mv "$TEMP_DIR/selah" "$TEMP_DIR/opt/selah/"
        if [ -d "$TEMP_DIR/data" ]; then
          mv "$TEMP_DIR/data" "$TEMP_DIR/opt/selah/"
        fi
        if [ -d "$TEMP_DIR/lib" ]; then
          mv "$TEMP_DIR/lib" "$TEMP_DIR/opt/selah/"
        fi

        ln -sf "/opt/selah/selah" "$TEMP_DIR/usr/bin/selah"
        printf '[Desktop Entry]\nName=Selah\nComment=A cross-platform Bible study app using Flutter and the 1769 King James Version\nExec=/usr/bin/selah\nIcon=io.github.toazd.selah.png\nType=Application\nCategories=Education\nKeywords=Bible;Study;KJV;\nStartupNotify=true\nStartupWMClass=io.github.toazd.selah\n' > "$TEMP_DIR/usr/share/applications/io.github.toazd.selah.desktop"

        fpm -s dir -t rpm \
          -n "$APP_NAME" \
          -v "$VERSION" \
          --iteration "${{ github.run_number }}" \
          --rpm-os linux \
          --description "A cross-platform Bible study app using Flutter and the 1769 King James Version" \
          --url "https://github.com/toazd/selah" \
          --maintainer "Selah Team" \
          --license "Unlicense" \
          -p "$OUTPUT_DIR" \
          -C "$TEMP_DIR" \
          usr/bin/selah \
          usr/share/applications/io.github.toazd.selah.desktop \
          usr/share/icons/ \
          opt/selah/
        rm -rf "$TEMP_DIR"

        echo "📦 Creating AppImage package..."
        TEMP_DIR2=$(mktemp -d)
        APPDIR=$(mktemp -d)/Selah.AppDir
        mkdir -p "$APPDIR"

        cp -r "$BUILD_DIR"/* "$APPDIR/"

        # Copy icon to root
        cp "$APPDIR/data/flutter_assets/assets/icon.png" "$APPDIR/io.github.toazd.selah.png"
        ln -s io.github.toazd.selah.png "$APPDIR/selah.png"

        # Create AppRun
        printf '#!/bin/sh\ncd "$(dirname "$0")"\nexec ./selah\n' > "$APPDIR/AppRun"
        chmod +x "$APPDIR/AppRun"

        # Create .desktop
        printf '[Desktop Entry]\nName=Selah\nComment=A cross-platform Bible study app using Flutter and the 1769 King James Version\nExec=selah\nIcon=io.github.toazd.selah\nType=Application\nCategories=Education\nStartupNotify=true\nStartupWMClass=io.github.toazd.selah\n' > "$APPDIR/io.github.toazd.selah.desktop"

        # download appimagetool
        wget -q -O appimagetool.AppImage "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
        chmod +x appimagetool.AppImage
        ./appimagetool.AppImage "$APPDIR" "$OUTPUT_DIR/Selah-${VERSION}.AppImage"
        rm -f appimagetool.AppImage
        rm -rf "$TEMP_DIR2" "$APPDIR"

        echo "📦 Creating Flatpak package..."
        TEMP_DIR3=$(mktemp -d)
        cp -r "$BUILD_DIR"/* "$TEMP_DIR3/"
        mkdir -p "$TEMP_DIR3/opt/selah" "$TEMP_DIR3/usr/share/icons/hicolor/256x256/apps" "$TEMP_DIR3/usr/share/applications"
        cp "$TEMP_DIR3/data/flutter_assets/assets/icon.png" "$TEMP_DIR3/usr/share/icons/hicolor/256x256/apps/selah.png"
        mv "$TEMP_DIR3/selah" "$TEMP_DIR3/opt/selah/"
        if [ -d "$TEMP_DIR3/data" ]; then
          mv "$TEMP_DIR3/data" "$TEMP_DIR3/opt/selah/"
        fi
        if [ -d "$TEMP_DIR3/lib" ]; then
          mv "$TEMP_DIR3/lib" "$TEMP_DIR3/opt/selah/"
        fi

        # Create desktop file for Flatpak
        mkdir -p "$TEMP_DIR3/usr/share/applications"
        printf '[Desktop Entry]\nName=Selah\nComment=A cross-platform Bible study app using Flutter and the 1769 King James Version\nExec=selah\nIcon=io.github.toazd.selah\nType=Application\nCategories=Education\nKeywords=Bible;Study;KJV;\nStartupNotify=true\nStartupWMClass=io.github.toazd.selah\n' > "$TEMP_DIR3/usr/share/applications/io.github.toazd.selah.desktop"

        # Prepare minimal flatpak manifest and build tree
        FLATPAK_BUILD="$TEMP_DIR3/flatpak-build"
        mkdir -p "$FLATPAK_BUILD/opt/selah" "$FLATPAK_BUILD/usr/share/icons/hicolor/256x256/apps" "$FLATPAK_BUILD/usr/share/applications"
        cp -r "$TEMP_DIR3/opt/selah/"* "$FLATPAK_BUILD/opt/selah/"
        if [ -f "$TEMP_DIR3/usr/share/applications/io.github.toazd.selah.desktop" ]; then
          cp "$TEMP_DIR3/usr/share/applications/io.github.toazd.selah.desktop" "$FLATPAK_BUILD/usr/share/applications/"
        fi
        cp "$TEMP_DIR3/usr/share/icons/hicolor/256x256/apps/selah.png" "$FLATPAK_BUILD/usr/share/icons/hicolor/256x256/apps/io.github.toazd.selah.png"
        # Copy LICENSE file for Flathub compliance
        cp LICENSE "$FLATPAK_BUILD/" || true

        MANIFEST="$TEMP_DIR3/io.github.toazd.selah.json"
        cat > "$MANIFEST" <<JSON
        {
          "app-id": "io.github.toazd.selah",
          "runtime": "org.freedesktop.Platform",
          "runtime-version": "25.08",
          "sdk": "org.freedesktop.Sdk",
          "command": "selah",
          "branch": "$VERSION",
          "finish-args": [
              "--socket=wayland",
              "--socket=fallback-x11",
              "--device=dri",
              "--share=ipc",
              "--share=network",
              "--talk-name=org.freedesktop.secrets",
              "--filesystem=xdg-config/selah:create",
              "--socket=system-bus",
              "--talk-name=org.freedesktop.NetworkManager"
            ],
          "modules": [
            {
              "name": "selah-bundle",
              "buildsystem": "simple",
              "build-commands": [
                "install -d /app/bin",
                "install -D -m755 opt/selah/selah /app/bin/selah",
                "cp -r opt/selah/lib /app/bin/",
                "cp -r opt/selah/data /app/bin/",
                "install -D -m644 usr/share/applications/io.github.toazd.selah.desktop /app/share/applications/io.github.toazd.selah.desktop",
                "install -D -m644 usr/share/icons/hicolor/256x256/apps/io.github.toazd.selah.png /app/share/icons/hicolor/256x256/apps/io.github.toazd.selah.png",
                "install -Dm0644 LICENSE $FLATPAK_DEST/share/licenses/$FLATPAK_ID/selah-bundle/LICENSE"
              ],
              "sources": [
                {
                  "type": "dir",
                  "path": "flatpak-build"
                }
              ]
            }
          ]
        }
        JSON

        cd "$TEMP_DIR3"
        flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
        flatpak-builder --user --force-clean --arch=x86_64 --repo=repo --install-deps-from=flathub build-dir "$MANIFEST"
        flatpak build-bundle repo "$OUTPUT_DIR/selah-${VERSION}.flatpak" io.github.toazd.selah "$VERSION"
        sync
        cd - || true
        rm -rf "$TEMP_DIR3" || true

        ls -lah build/packages/
        ls -lah "$OUTPUT_DIR"

    - name: Upload Linux Debian package artifact
      uses: actions/upload-artifact@v6
      with:
        name: linux-deb-package
        path: build/packages/selah_*.deb
        if-no-files-found: error
        retention-days: 1

    - name: Upload Linux to Release
      uses: softprops/action-gh-release@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        tag_name: v${{ needs.extract-version.outputs.app_version }}-build.${{ github.run_number }}
        name: Selah v${{ needs.extract-version.outputs.app_version }} - Build ${{ github.run_number }}
        draft: false
        prerelease: false
        files: build/packages/*
        body: |
          # Selah Release v${{ needs.extract-version.outputs.app_version }}
          ## Build #${{ github.run_number }}

          ## 📦 Installation files by Platform
          Selah is not currently available in any app stores so some platforms require manual installation.

          ### 🪟 Windows
          - `Selah-Windows-${{ needs.extract-version.outputs.app_version }}.exe`
            - Windows installer (recommended; includes Start Menu and Desktop shortcuts, easy uninstall)
          - `Selah-Windows-${{ needs.extract-version.outputs.app_version }}.zip`
            - Windows portable archive (x64) - (unzip anywhere and run selah.exe; no installation required)

          ### 🐧 Arch / CachyOS / Manjaro Linux
          - Automated - Any AUR helper (eg. `paru -S selah-bin`)
          - Manual - `makepkg -sirc` after cloning `https://aur.archlinux.org/selah-bin.git`

          ### 🐧 Linux Other
          - Generic x86_64 - (unpack and run from anywhere)
            - `Selah-${{ needs.extract-version.outputs.app_version }}.tar.gz`
          - Debian / Ubuntu
            - `selah-${{ needs.extract-version.outputs.app_version }}-*.deb`
            - `sudo dpkg -i ./Selah-X.X.X.deb`
          - Red Hat / Fedora
            - `selah-${{ needs.extract-version.outputs.app_version }}-*.rpm`
            - `sudo dnf install ./Selah-X.X.X.rpm` (NOTE: rpms are not signed)
          - AppImage
            - `Selah-${{ needs.extract-version.outputs.app_version }}.AppImage`
            - `chmod +x Selah-X.X.X.AppImage; ./Selah-X.X.X.AppImage` (NOTE: you may need to install `fuse2`)
          - Flatpak
            - `selah-${{ needs.extract-version.outputs.app_version }}.flatpak`
            - `flatpak install ./Selah-X.X.X.flatpak`
          - Snap
            - `Selah-${{ needs.extract-version.outputs.app_version }}.snap`
            - `snap install --dangerous ./Selah-X.X.X.snap`

          ### 🤖 Android & ChromeOS
          - Universal Android app
            - `Selah-${{ needs.extract-version.outputs.app_version }}.apk`
              - `adb install ./Selah-X.X.X.apk` or install on the device.

          ### 🍎 iOS
          - iOS app
            - Unsigned for sideloading (Sideloadly)
            - `Selah-${{ needs.extract-version.outputs.app_version }}-${{ github.run_number }}.ipa`

          ### 🍎 macOS
          - Disk image installer
            - Untested builds. Need feedback!
            - `Selah-${{ needs.extract-version.outputs.app_version }}.dmg`

          ### 🌐 Web
          - Web build archive
            - `Selah-Web-0.7.5.zip`
            - Requires a real web server (extract to server root).
            - https://toazd.github.io/bible

  build-snap:
    name: Build Snap Package
    needs:
      - extract-version
      - build-linux
    runs-on: ubuntu-22.04
    permissions:
      actions: write
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Download Linux Debian package artifact
      uses: actions/download-artifact@v8
      with:
        name: linux-deb-package
        path: build/packages

    - name: Prepare Snap build directory
      run: |
        mkdir -p build/snap-build/snap/gui
        cp snapcraft/snapcraft.yaml build/snap-build/snapcraft.yaml
        cp snapcraft/io.github.toazd.selah.desktop build/snap-build/snap/gui/
        cp snapcraft/io.github.toazd.selah.svg build/snap-build/snap/gui/

    - name: Install snapcraft dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y snapd squashfs-tools dpkg-dev
        sudo snap install core22
        sudo snap install snapcraft --classic

    - name: Extract Debian package for Snap build
      run: |
        set -e
        mkdir -p build/snap-build/prime
        DEB_FILE=$(ls build/packages/selah_*.deb | head -n1)
        if [ -z "$DEB_FILE" ]; then
          echo "❌ Debian package not found"
          ls -lah build/packages
          exit 1
        fi
        dpkg-deb -x "$DEB_FILE" build/snap-build/prime
        rm -f "$DEB_FILE"
        mkdir -p build/snap-build/prime/usr/share/applications
        mkdir -p build/snap-build/prime/usr/share/icons/hicolor/256x256/apps

    - name: Set Snapcraft version
      run: |
        VERSION="${{ needs.extract-version.outputs.app_version }}"
        sed -i "s/^version: .*/version: \"$VERSION\"/" build/snap-build/snapcraft.yaml

    - name: Build Snap package
      run: |
        cd build/snap-build
        sudo snapcraft pack --destructive-mode --output ../packages
        cd -
        SNAP_FILE=""
        for file in build/packages/*.snap; do
          if [ -f "$file" ]; then
            SNAP_FILE="$file"
            break
          fi
        done
        if [ -z "$SNAP_FILE" ]; then
          echo "❌ Snap package not found"
          ls -lah build/packages
          exit 1
        fi
        SNAP_TARGET="build/packages/Selah-${{ needs.extract-version.outputs.app_version }}.snap"
        if [ "$SNAP_FILE" != "$SNAP_TARGET" ]; then
          mv "$SNAP_FILE" "$SNAP_TARGET"
        fi
        ls -lah build/packages

    - name: Upload Snap to Release
      uses: softprops/action-gh-release@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        tag_name: v${{ needs.extract-version.outputs.app_version }}-build.${{ github.run_number }}
        name: Selah v${{ needs.extract-version.outputs.app_version }} - Build ${{ github.run_number }}
        draft: false
        prerelease: false
        files: build/packages/*.snap

    - name: Delete temporary Linux Debian artifact
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        ARTIFACT_ID=$(
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --jq '.artifacts[] | select(.name == "linux-deb-package") | .id' \
            | head -n 1
        )
        if [ -z "$ARTIFACT_ID" ]; then
          echo "No temporary Debian artifact found to delete."
          exit 0
        fi
        gh api --method DELETE "repos/${{ github.repository }}/actions/artifacts/${ARTIFACT_ID}"
        echo "Deleted temporary Debian artifact $ARTIFACT_ID."

  build-web:
    name: Build Web App
    needs: extract-version
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Cache Flutter dependencies
      uses: actions/cache@v5
      with:
        path: |
          ~/.flutter-cache
          ~/.pub-cache
        key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}
        restore-keys: |
          ${{ runner.os }}-flutter-

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'

    - name: Setup Node.js for web build
      uses: actions/setup-node@v6
      with:
        node-version: '18'

    - name: Clean build
      run: flutter clean

    - name: Get flutter dependencies
      run: flutter pub get

    - name: Build Web release
      run: |
        flutter build web \
          --release \
          --target lib/main.dart \
          --dart-define=BUILD_NUMBER=${{ github.run_number }} \
          --wasm

    - name: Create web build archive
      run: |
        mkdir -p build/artifacts
        cd build/web
        zip -r "../../build/artifacts/Selah-Web-${{ needs.extract-version.outputs.app_version }}.zip" .
        cd ../..
        ls -lah build/artifacts/

    - name: Upload Web to Release
      uses: softprops/action-gh-release@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        tag_name: v${{ needs.extract-version.outputs.app_version }}-build.${{ github.run_number }}
        name: Selah v${{ needs.extract-version.outputs.app_version }} - Build ${{ github.run_number }}
        draft: false
        prerelease: false
        files: build/artifacts/*

  build-android:
    name: Build Android App
    needs: extract-version
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Cache Flutter dependencies
      uses: actions/cache@v5
      with:
        path: |
          ~/.flutter-cache
          ~/.pub-cache
        key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}
        restore-keys: |
          ${{ runner.os }}-flutter-

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'

    - name: Setup Java JDK
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4

    - name: Accept Android licenses
      run: yes | flutter doctor --android-licenses

    - name: Clean build
      run: flutter clean

    - name: Get flutter dependencies
      run: flutter pub get


    - name: Create release keystore (for signing)
      run: |
        if [ -f android/app/selah-release.keystore ]; then
          echo "Keystore already exists"
        else
          echo "Generating selah-release.keystore for CI signing"
          keytool -genkeypair -v \
            -keystore android/app/selah-release.keystore \
            -storepass '2Samuel22:33' \
            -alias selah-key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keypass '2Samuel22:33' \
            -dname "CN=CI, OU=CI, O=Selah, L=CI, ST=CI, C=US"
        fi

    - name: Build Android APK
      run: |
        flutter build apk \
          --release \
          --target lib/main.dart \
          --dart-define=BUILD_NUMBER=${{ github.run_number }}

    - name: Rename APK artifact
      run: |
        mkdir -p build/artifacts
        cp build/app/outputs/flutter-apk/app-release.apk "build/artifacts/Selah-${{ needs.extract-version.outputs.app_version }}.apk"
        ls -lah build/artifacts/

    - name: Upload Android to Release
      uses: softprops/action-gh-release@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        tag_name: v${{ needs.extract-version.outputs.app_version }}-build.${{ github.run_number }}
        name: Selah v${{ needs.extract-version.outputs.app_version }} - Build ${{ github.run_number }}
        draft: false
        prerelease: false
        files: build/artifacts/*

  build-ios:
    name: Build iOS App
    needs: extract-version
    runs-on: macos-26
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Cache Flutter dependencies
      uses: actions/cache@v5
      with:
        path: |
          ~/.flutter-cache
          ~/.pub-cache
        key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}
        restore-keys: |
          ${{ runner.os }}-flutter-

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'

    - name: Clean build
      run: flutter clean

    - name: Get flutter dependencies
      run: flutter pub get

    - name: Setup iOS platform
      run: |
        if [ ! -f "ios/Podfile" ]; then
          echo "⚠️ Podfile not found. Regenerating iOS platform files..."
          flutter precache --ios
          flutter create --platforms ios .
        else
          echo "✅ Podfile found"
        fi

    - name: Set iOS platform version
      run: |
        if [ ! -f "ios/Podfile" ]; then
          echo "⚠️ Podfile still missing. Creating Flutter iOS Podfile..."
          cat > ios/Podfile <<'RUBY'
        platform :ios, '15.0'

        ENV['COCOAPODS_DISABLE_STATS'] = 'true'

        project 'Runner', {
          'Debug' => :debug,
          'Profile' => :release,
          'Release' => :release,
        }

        def flutter_root
          generated_xcode_build_settings_path = File.expand_path(File.join('..', 'Flutter', 'Generated.xcconfig'), __FILE__)
          unless File.exist?(generated_xcode_build_settings_path)
            raise "#{generated_xcode_build_settings_path} must exist. Run flutter pub get first."
          end

          File.foreach(generated_xcode_build_settings_path) do |line|
            matches = line.match(/FLUTTER_ROOT\=(.*)/)
            return matches[1].strip if matches
          end
          raise "FLUTTER_ROOT not found in #{generated_xcode_build_settings_path}."
        end

        require File.expand_path(File.join('packages', 'flutter_tools', 'bin', 'podhelper'), flutter_root)

        flutter_ios_podfile_setup

        target 'Runner' do
          use_frameworks!

          flutter_install_all_ios_pods File.dirname(File.realpath(__FILE__))
          target 'RunnerTests' do
            inherit! :search_paths
          end
        end

        post_install do |installer|
          installer.pods_project.targets.each do |target|
            flutter_additional_ios_build_settings(target)
            target.build_configurations.each do |config|
              config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
            end
          end
        end
        RUBY
        elif grep -q "^[[:space:]]*#*[[:space:]]*platform :ios" ios/Podfile; then
          ruby -0pi -e "gsub(/^[[:space:]]*#*[[:space:]]*platform :ios, *['\"][0-9.]+['\"]/, \"platform :ios, '15.0'\")" ios/Podfile
        else
          tmpfile=$(mktemp)
          printf "platform :ios, '15.0'\n" > "$tmpfile"
          cat ios/Podfile >> "$tmpfile"
          mv "$tmpfile" ios/Podfile
        fi

    - name: Get iOS dependencies
      run: |
        cd ios
        pod repo update
        pod install
        cd ..

    - name: Build iOS release
      run: |
        flutter build ios \
          --release \
          --no-codesign \
          --target lib/main.dart \
          --dart-define=BUILD_NUMBER=${{ github.run_number }}

    - name: Create IPA file
      run: |
        mkdir -p build/ios-ipa
        BUILD_DIR=$(find build/ -name "Runner.app" -type d | head -1)

        if [ -z "$BUILD_DIR" ]; then
          echo "❌ Could not find Runner.app"
          exit 1
        fi

        cp -R "$BUILD_DIR" build/ios-ipa/
        mkdir -p build/ios-ipa/Payload
        mv build/ios-ipa/Runner.app build/ios-ipa/Payload/Selah.app

        cd build/ios-ipa
        zip -r "../../build/Selah-${{ needs.extract-version.outputs.app_version }}-${{ github.run_number }}.ipa" Payload
        cd ../..

    - name: Upload iOS to Release
      uses: softprops/action-gh-release@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        tag_name: v${{ needs.extract-version.outputs.app_version }}-build.${{ github.run_number }}
        name: Selah v${{ needs.extract-version.outputs.app_version }} - Build ${{ github.run_number }}
        draft: false
        prerelease: false
        files: build/Selah-*.ipa

  build-macos:
    name: Build macOS Desktop App
    needs: extract-version
    runs-on: macos-26
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Cache Flutter dependencies
      uses: actions/cache@v5
      with:
        path: |
          ~/.flutter-cache
          ~/.pub-cache
        key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}
        restore-keys: |
          ${{ runner.os }}-flutter-

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'

    - name: Clean build
      run: flutter clean

    - name: Get flutter dependencies
      run: flutter pub get

    - name: Build macOS release
      run: |
        flutter build macos \
          --release \
          --target lib/main.dart \
          --dart-define=BUILD_NUMBER=${{ github.run_number }}

    - name: Create DMG package
      run: |
        VERSION="${{ needs.extract-version.outputs.app_version }}"
        BUILD_DIR="build/macos/Build/Products/Release/Selah.app"
        OUTPUT_DIR="build/packages"
        DMG_NAME="Selah-${VERSION}.dmg"

        mkdir -p $OUTPUT_DIR

        if [ ! -d "$BUILD_DIR" ]; then
          echo "❌ Selah.app not found"
          exit 1
        fi

        DMG_DIR="$OUTPUT_DIR/dmg"
        mkdir -p "$DMG_DIR"
        cp -R "$BUILD_DIR" "$DMG_DIR/"

        # Ensure file operations are complete before creating DMG
        sync

        echo "📦 Creating DMG..."
        hdiutil create -volname "Selah $VERSION" \
          -srcfolder "$DMG_DIR" \
          -ov \
          -format UDZO \
          "$OUTPUT_DIR/$DMG_NAME"

        cp -R "$BUILD_DIR" "$OUTPUT_DIR/"
        ls -lah "$OUTPUT_DIR"

    - name: Upload macOS to Release
      uses: softprops/action-gh-release@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        tag_name: v${{ needs.extract-version.outputs.app_version }}-build.${{ github.run_number }}
        name: Selah v${{ needs.extract-version.outputs.app_version }} - Build ${{ github.run_number }}
        draft: false
        prerelease: false
        files: build/packages/*

  build-windows:
    name: Build Windows App
    needs: extract-version
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'

    - name: Verify Windows toolchain
      run: flutter doctor -v

    - name: Clean build
      run: flutter clean

    - name: Get flutter dependencies
      run: flutter pub get

    - name: Install Inno Setup
      run: choco install innosetup -y

    - name: Build Windows release
      run: flutter build windows --release --target lib/main.dart --dart-define=BUILD_NUMBER=${{ github.run_number }}

    - name: Package Windows build
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path build\artifacts | Out-Null
        $out = "build\artifacts\Selah-Windows-${{ needs.extract-version.outputs.app_version }}.zip"
        $p1 = 'build\windows\runner\Release'
        $p2 = 'build\windows\x64\runner\Release'
        if (Test-Path $p2) {
          Write-Host "Using $p2"
          Compress-Archive -Path "$p2\*" -DestinationPath $out -Force
        } elseif (Test-Path $p1) {
          Write-Host "Using $p1"
          Compress-Archive -Path "$p1\*" -DestinationPath $out -Force
        } else {
          Write-Error "Windows build output not found. Checked: $p1 and $p2"
          Get-ChildItem build -Recurse | Select-Object -First 50 | Format-Table
          exit 1
        }
        Get-ChildItem build\artifacts | Format-Table

    - name: Create Inno Setup installer
      shell: cmd
      run: |
        set PATH=%PATH%;C:\Program Files (x86)\Inno Setup 6
        iscc.exe /DMyAppVersion="${{ needs.extract-version.outputs.app_version }}" selah.iss
        if errorlevel 1 exit /b 1

    - name: Upload Windows to Release
      uses: softprops/action-gh-release@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        tag_name: v${{ needs.extract-version.outputs.app_version }}-build.${{ github.run_number }}
        name: Selah v${{ needs.extract-version.outputs.app_version }} - Build ${{ github.run_number }}
        draft: false
        prerelease: false
        files: build/artifacts/*

  publish-aur:
      name: Publish to Arch User Repository
      needs:
        - extract-version
        - build-linux
      runs-on: ubuntu-latest
      permissions:
        contents: write
      steps:
      - name: Checkout repository source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Configure SSH credentials for AUR
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AUR_SSH_PRIVATE_KEY }}" > ~/.ssh/aur_key
          chmod 600 ~/.ssh/aur_key
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts

      - name: Clone official AUR tracking repo
        run: |
          # Pull down the live tracking repository into an isolated directory
          GIT_SSH_COMMAND="ssh -i ~/.ssh/aur_key" git clone ssh://aur@aur.archlinux.org/selah-bin.git aur-workspace
          cd aur-workspace
          git config user.name "toazd"
          git config user.email "wmcdannell@gmail.com"

      - name: Dynamically compute updates and sync files
        run: |
          VERSION="${{ needs.extract-version.outputs.app_version }}"
          RUN_NUM="${{ github.run_number }}"

          # Match the exact naming convention generated by fpm in the build-linux step
          ASSET_NAME="selah_${VERSION}_amd64.deb"
          RELEASE_URL="https://github.com/toazd/selah/releases/download/v${VERSION}-build.${RUN_NUM}/${ASSET_NAME}"

          # 1. Download the asset file to calculate an authentic hash signature
          echo "📥 Fetching release asset to calculate checksum profile..."
          curl -fL -O "$RELEASE_URL"

          # check to make sure download success
          if ! file "$ASSET_NAME" | grep -q 'Debian binary package'; then
            echo "Downloaded file is not a Debian package"
            file "$ASSET_NAME"
            exit 1
          fi

          NEW_SHA=$(sha256sum "$ASSET_NAME" | awk '{print $1}')
          rm "$ASSET_NAME"

          CURRENT_PKGVER=$(sed -n 's/^pkgver=//p' aur-workspace/PKGBUILD)
          CURRENT_PKGREL=$(sed -n 's/^pkgrel=//p' aur-workspace/PKGBUILD)
          CURRENT_SHA=$(sed -n "s/^sha256sums=('\([^']*\)').*/\1/p" aur-workspace/PKGBUILD)

          case "$CURRENT_PKGREL" in
            ''|*[!0-9]*) CURRENT_PKGREL=0 ;;
          esac

          if [ "$CURRENT_PKGVER" != "$VERSION" ]; then
            PKGREL=1
          elif grep -Fq "::${RELEASE_URL}\")" aur-workspace/PKGBUILD && [ "$CURRENT_SHA" = "$NEW_SHA" ]; then
            PKGREL="$CURRENT_PKGREL"
          else
            PKGREL=$((CURRENT_PKGREL + 1))
          fi

          # 2. Copy your repo's template PKGBUILD over to our workspace
          cp arch-aur/PKGBUILD aur-workspace/PKGBUILD
          cd aur-workspace

          # 3. Inject the dynamic fields safely using basic stream editing
          sed -i "s|^pkgver=.*|pkgver=${VERSION}|" PKGBUILD
          sed -i "s|^pkgrel=.*|pkgrel=${PKGREL}|" PKGBUILD
          sed -i "s|^source=.*|source=(\"\${pkgname}-\${pkgver}-\${pkgrel}.deb::${RELEASE_URL}\")|" PKGBUILD
          sed -i "s|^sha256sums=.*|sha256sums=('${NEW_SHA}')|" PKGBUILD

      - name: Generate .SRCINFO via Arch Linux Container
        uses: docker://archlinux:latest
        with:
          args: >
            bash -c "pacman -Syu --noconfirm pacman-contrib && chown -R nobody:nobody $GITHUB_WORKSPACE/aur-workspace && cd $GITHUB_WORKSPACE/aur-workspace && runuser -u nobody -- makepkg --printsrcinfo > .SRCINFO && chown -R 1001:1001 $GITHUB_WORKSPACE/aur-workspace"

      - name: Sync generated AUR files back to repository
        run: |
          cp aur-workspace/PKGBUILD arch-aur/PKGBUILD
          cp aur-workspace/.SRCINFO arch-aur/.SRCINFO

      - name: Commit and Push Changes directly to AUR
        run: |
          cd $GITHUB_WORKSPACE/aur-workspace
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "AUR metadata is already current; nothing to push."
          else
            git commit -m "Github actions automated update for v${{ needs.extract-version.outputs.app_version }} (Build ${{ github.run_number }})"
            GIT_SSH_COMMAND="ssh -i ~/.ssh/aur_key" git push origin master
          fi

      - name: Commit generated AUR files back to repository
        if: github.ref_type == 'branch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add arch-aur/PKGBUILD arch-aur/.SRCINFO
          if git diff --cached --quiet; then
            echo "Repository AUR files are already current; nothing to push."
          else
            git commit -m "Update generated AUR metadata for v${{ needs.extract-version.outputs.app_version }} build ${{ github.run_number }}"
            git push origin HEAD:${{ github.ref_name }}
          fi
