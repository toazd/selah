name: Build All Platforms

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number (optional)'
        required: false
        type: string
        default: ''

jobs:
  extract-version:
    name: Extract App Version
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.extract.outputs.app_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Extract app version
        id: extract
        run: |
          APP_VERSION=$(grep "final appVersion" lib/main.dart | sed 's/.*= "\(.*\)".*/\1/')
          echo "app_version=$APP_VERSION" >> $GITHUB_OUTPUT
          echo "📋 App version: $APP_VERSION"

  build-linux:
    name: Build Linux App
    needs: extract-version
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Cache Flutter dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.flutter-cache
          ~/.pub-cache
        key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}
        restore-keys: |
          ${{ runner.os }}-flutter-

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.41.1'
        channel: 'stable'

    - name: Clean build
      run: flutter clean

    - name: Get flutter dependencies
      run: flutter pub get

    - name: Install Linux build dependencies & packaging tools
      run: |
        sudo snap remove --purge firefox
        sudo apt-get purge -y firefox
        sudo rm -rf ~/snap/firefox
        sudo apt-get update
        sudo apt-get full-upgrade -y
        sudo apt-get install -y \
          clang \
          cmake \
          ninja-build \
          pkg-config \
          libgtk-3-dev \
          libblkid-dev \
          liblzma-dev \
          ruby \
          ruby-dev \
          build-essential \
          rpm
        sudo snap refresh
        sudo gem install fpm

    - name: Build Linux release
      run: |
        flutter build linux \
          --release \
          --target lib/main.dart \
          --dart-define=BUILD_NUMBER=${{ github.run_number }}

    - name: Create packages
      run: |
        APP_NAME="selah"
        VERSION="${{ needs.extract-version.outputs.app_version }}"
        BUILD_DIR="build/linux/x64/release/bundle"
        OUTPUT_DIR="build/packages"

        mkdir -p "$OUTPUT_DIR"

        echo "📦 Creating .tar.gz package..."
        tar -czf "$OUTPUT_DIR/Selah-${VERSION}.tar.gz" -C "$BUILD_DIR" .

        echo "📦 Creating .deb package..."
        TEMP_DIR=$(mktemp -d)
        cp -r "$BUILD_DIR"/* "$TEMP_DIR/"
        mkdir -p "$TEMP_DIR/usr/bin"
        mkdir -p "$TEMP_DIR/usr/share/applications"
        mkdir -p "$TEMP_DIR/usr/share/icons/hicolor/256x256/apps"
        mkdir -p "$TEMP_DIR/opt/selah"
        
        cp "$TEMP_DIR/data/flutter_assets/assets/icon.png" "$TEMP_DIR/usr/share/icons/hicolor/256x256/apps/selah.png"
        mv "$TEMP_DIR/selah" "$TEMP_DIR/opt/selah/"
        if [ -d "$TEMP_DIR/data" ]; then
          mv "$TEMP_DIR/data" "$TEMP_DIR/opt/selah/"
        fi
        if [ -d "$TEMP_DIR/lib" ]; then
          mv "$TEMP_DIR/lib" "$TEMP_DIR/opt/selah/"
        fi
        
        ln -sf "/opt/selah/selah" "$TEMP_DIR/usr/bin/selah"
        printf '[Desktop Entry]\nName=Selah\nComment=A cross-platform Bible study app using Flutter and the 1769 King James Version\nExec=/usr/bin/selah\nIcon=/usr/share/icons/hicolor/256x256/apps/selah.png\nType=Application\nCategories=Office;Education;\nKeywords=Bible;Study;KJV;\nStartupNotify=true\nStartupWMClass=com.selah.holybible\n' > "$TEMP_DIR/usr/share/applications/selah.desktop"
        
        fpm -s dir -t deb \
          -n "$APP_NAME" \
          -v "$VERSION" \
          --deb-priority optional \
          --category utils \
          --description "A cross-platform Bible study app using Flutter and the 1769 King James Version" \
          --url "https://github.com/toazd/selah" \
          --maintainer "Selah Team" \
          --license "Unlicense" \
          -p "$OUTPUT_DIR" \
          -C "$TEMP_DIR" \
          usr/bin/selah \
          usr/share/applications/selah.desktop \
          usr/share/icons/ \
          opt/selah/
        rm -rf "$TEMP_DIR"

        echo "📦 Creating .rpm package..."
        TEMP_DIR=$(mktemp -d)
        cp -r "$BUILD_DIR"/* "$TEMP_DIR/"
        mkdir -p "$TEMP_DIR/usr/bin"
        mkdir -p "$TEMP_DIR/usr/share/applications"
        mkdir -p "$TEMP_DIR/usr/share/icons/hicolor/256x256/apps"
        mkdir -p "$TEMP_DIR/opt/selah"
        
        cp "$TEMP_DIR/data/flutter_assets/assets/icon.png" "$TEMP_DIR/usr/share/icons/hicolor/256x256/apps/selah.png"
        mv "$TEMP_DIR/selah" "$TEMP_DIR/opt/selah/"
        if [ -d "$TEMP_DIR/data" ]; then
          mv "$TEMP_DIR/data" "$TEMP_DIR/opt/selah/"
        fi
        if [ -d "$TEMP_DIR/lib" ]; then
          mv "$TEMP_DIR/lib" "$TEMP_DIR/opt/selah/"
        fi
        
        ln -sf "/opt/selah/selah" "$TEMP_DIR/usr/bin/selah"
        printf '[Desktop Entry]\nName=Selah\nComment=A cross-platform Bible study app using Flutter and the 1769 King James Version\nExec=/usr/bin/selah\nIcon=/usr/share/icons/hicolor/256x256/apps/selah.png\nType=Application\nCategories=Office;Education;\nKeywords=Bible;Study;KJV;\nStartupNotify=true\nStartupWMClass=com.selah.holybible\n' > "$TEMP_DIR/usr/share/applications/selah.desktop"
        
        fpm -s dir -t rpm \
          -n "$APP_NAME" \
          -v "$VERSION" \
          --rpm-os linux \
          --description "A cross-platform Bible study app using Flutter and the 1769 King James Version" \
          --url "https://github.com/toazd/selah" \
          --maintainer "Selah Team" \
          --license "Unlicense" \
          -p "$OUTPUT_DIR" \
          -C "$TEMP_DIR" \
          usr/bin/selah \
          usr/share/applications/selah.desktop \
          usr/share/icons/ \
          opt/selah/
        rm -rf "$TEMP_DIR"

        ls -lah "$OUTPUT_DIR"

    - name: Upload Linux to Release
      uses: softprops/action-gh-release@v1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        tag_name: v${{ needs.extract-version.outputs.app_version }}-build.${{ github.run_number }}
        name: Selah v${{ needs.extract-version.outputs.app_version }} - Build ${{ github.run_number }}
        draft: false
        prerelease: false
        files: build/packages/*
        body: |
          # Selah Release v${{ needs.extract-version.outputs.app_version }}
          ## Build #${{ github.run_number }}
          
          This unified release contains builds for all supported platforms.
          
          ## 📦 Installation files by Platform
          
          ### 🐧 Linux
          - `Selah-${{ needs.extract-version.outputs.app_version }}.tar.gz` - Generic Linux (all distributions)
          - `selah-${{ needs.extract-version.outputs.app_version }}-*.deb` - Debian/Ubuntu
          - `selah-${{ needs.extract-version.outputs.app_version }}-*.rpm` - Red Hat/Fedora
          
          ### 🤖 Android
          - `Selah-${{ needs.extract-version.outputs.app_version }}.apk` - Universal Android app
          
          ### 🍎 iOS
          - `Selah-${{ needs.extract-version.outputs.app_version }}-${{ github.run_number }}.ipa` - iOS app (unsigned for sideloading)
          
          ### 🍎 macOS
          - `Selah-${{ needs.extract-version.outputs.app_version }}.dmg` - Disk image installer
          - `Selah.app` - Standalone app bundle
          
          ### 🌐 Web
          - `Selah-Web-${{ needs.extract-version.outputs.app_version }}.zip` - Web build archive

  build-web:
    name: Build Web App
    needs: extract-version
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Cache Flutter dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.flutter-cache
          ~/.pub-cache
        key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}
        restore-keys: |
          ${{ runner.os }}-flutter-

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.38.9'
        channel: 'stable'

    - name: Setup Node.js for web build
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Clean build
      run: flutter clean

    - name: Get flutter dependencies
      run: flutter pub get

    - name: Build Web release
      run: |
        flutter build web \
          --release \
          --target lib/main.dart \
          --dart-define=BUILD_NUMBER=${{ github.run_number }}

    - name: Create web build archive
      run: |
        mkdir -p build/artifacts
        cd build/web
        zip -r "../../build/artifacts/Selah-Web-${{ needs.extract-version.outputs.app_version }}.zip" .
        cd ../..
        ls -lah build/artifacts/

    - name: Upload Web to Release
      uses: softprops/action-gh-release@v1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        tag_name: v${{ needs.extract-version.outputs.app_version }}-build.${{ github.run_number }}
        name: Selah v${{ needs.extract-version.outputs.app_version }} - Build ${{ github.run_number }}
        draft: false
        prerelease: false
        files: build/artifacts/*

  build-android:
    name: Build Android App
    needs: extract-version
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Cache Flutter dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.flutter-cache
          ~/.pub-cache
        key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}
        restore-keys: |
          ${{ runner.os }}-flutter-

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.38.9'
        channel: 'stable'

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept Android licenses
      run: yes | flutter doctor --android-licenses

    - name: Clean build
      run: flutter clean

    - name: Get flutter dependencies
      run: flutter pub get


    - name: Create release keystore (for signing)
      run: |
        if [ -f android/app/selah-release.keystore ]; then
          echo "Keystore already exists"
        else
          echo "Generating selah-release.keystore for CI signing"
          keytool -genkeypair -v \
            -keystore android/app/selah-release.keystore \
            -storepass '2Samuel22:33' \
            -alias selah-key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keypass '2Samuel22:33' \
            -dname "CN=CI, OU=CI, O=Selah, L=CI, ST=CI, C=US"
        fi

    - name: Build Android APK
      run: |
        flutter build apk \
          --release \
          --target lib/main.dart \
          --dart-define=BUILD_NUMBER=${{ github.run_number }}

    - name: Rename APK artifact
      run: |
        mkdir -p build/artifacts
        cp build/app/outputs/flutter-apk/app-release.apk "build/artifacts/Selah-${{ needs.extract-version.outputs.app_version }}.apk"
        ls -lah build/artifacts/

    - name: Upload Android to Release
      uses: softprops/action-gh-release@v1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        tag_name: v${{ needs.extract-version.outputs.app_version }}-build.${{ github.run_number }}
        name: Selah v${{ needs.extract-version.outputs.app_version }} - Build ${{ github.run_number }}
        draft: false
        prerelease: false
        files: build/artifacts/*

  build-ios:
    name: Build iOS App
    needs: extract-version
    runs-on: macos-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Cache Flutter dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.flutter-cache
          ~/.pub-cache
        key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}
        restore-keys: |
          ${{ runner.os }}-flutter-
          
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.38.9'
        channel: 'stable'

    - name: Setup iOS platform
      run: |
        if [ ! -f "ios/Podfile" ]; then
          echo "⚠️ Podfile not found. Regenerating iOS platform files..."
          flutter precache --ios
          flutter create --platforms ios .
        else
          echo "✅ Podfile found"
        fi
        
    - name: Set iOS platform version
      run: |
        if grep -q "platform :ios" ios/Podfile; then
          CURRENT_VERSION=$(grep "platform :ios" ios/Podfile | sed -n "s/.*'\([0-9.]*\)'.*/\1/p")
          if [[ "$(printf '%s\n' "13.0" "$CURRENT_VERSION" | sort -V | head -n1)" != "13.0" ]]; then
            echo "platform :ios, '13.0'" > ios/Podfile.tmp
            grep -v "platform :ios" ios/Podfile >> ios/Podfile.tmp
            mv ios/Podfile.tmp ios/Podfile
          fi
        else
          sed -i '' '1i platform :ios, '\''13.0'\''' ios/Podfile
        fi
        
    - name: Get iOS dependencies
      run: |
        cd ios
        pod repo update
        pod install
        cd ..

    - name: Clean build
      run: flutter clean
      
    - name: Get flutter dependencies
      run: flutter pub get

    - name: Build iOS release
      run: |
        flutter build ios \
          --release \
          --no-codesign \
          --target lib/main.dart \
          --dart-define=BUILD_NUMBER=${{ github.run_number }}
          
    - name: Create IPA file
      run: |
        mkdir -p build/ios-ipa
        BUILD_DIR=$(find build/ -name "Runner.app" -type d | head -1)
        
        if [ -z "$BUILD_DIR" ]; then
          echo "❌ Could not find Runner.app"
          exit 1
        fi

        cp -R "$BUILD_DIR" build/ios-ipa/
        mkdir -p build/ios-ipa/Payload
        mv build/ios-ipa/Runner.app build/ios-ipa/Payload/Selah.app
        
        cd build/ios-ipa
        zip -r "../../build/Selah-${{ needs.extract-version.outputs.app_version }}-${{ github.run_number }}.ipa" Payload
        cd ../..

    - name: Upload iOS to Release
      uses: softprops/action-gh-release@v1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        tag_name: v${{ needs.extract-version.outputs.app_version }}-build.${{ github.run_number }}
        name: Selah v${{ needs.extract-version.outputs.app_version }} - Build ${{ github.run_number }}
        draft: false
        prerelease: false
        files: build/Selah-*.ipa

  build-macos:
    name: Build macOS Desktop App
    needs: extract-version
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Cache Flutter dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.flutter-cache
          ~/.pub-cache
        key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}
        restore-keys: |
          ${{ runner.os }}-flutter-

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.38.9'
        channel: 'stable'

    - name: Clean build
      run: flutter clean

    - name: Get flutter dependencies
      run: flutter pub get

    - name: Build macOS release
      run: |
        flutter build macos \
          --release \
          --target lib/main.dart \
          --dart-define=BUILD_NUMBER=${{ github.run_number }}

    - name: Create DMG package
      run: |
        VERSION="${{ needs.extract-version.outputs.app_version }}"
        BUILD_DIR="build/macos/Build/Products/Release/Selah.app"
        OUTPUT_DIR="build/packages"
        DMG_NAME="Selah-${VERSION}.dmg"

        mkdir -p $OUTPUT_DIR

        if [ ! -d "$BUILD_DIR" ]; then
          echo "❌ Selah.app not found"
          exit 1
        fi

        DMG_DIR="$OUTPUT_DIR/dmg"
        mkdir -p "$DMG_DIR"
        cp -R "$BUILD_DIR" "$DMG_DIR/"

        echo "📦 Creating DMG..."
        hdiutil create -volname "Selah $VERSION" \
          -srcfolder "$DMG_DIR" \
          -ov \
          -format UDZO \
          "$OUTPUT_DIR/$DMG_NAME"

        cp -R "$BUILD_DIR" "$OUTPUT_DIR/"
        ls -lah "$OUTPUT_DIR"

    - name: Upload macOS to Release
      uses: softprops/action-gh-release@v1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        tag_name: v${{ needs.extract-version.outputs.app_version }}-build.${{ github.run_number }}
        name: Selah v${{ needs.extract-version.outputs.app_version }} - Build ${{ github.run_number }}
        draft: false
        prerelease: false
        files: build/packages/*

  build-windows:
    name: Build Windows App
    needs: extract-version
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.38.9'
        channel: 'stable'

    - name: Verify Windows toolchain
      run: flutter doctor -v

    - name: Clean build
      run: flutter clean

    - name: Get flutter dependencies
      run: flutter pub get

    - name: Build Windows release
      run: flutter build windows --release --target lib/main.dart --dart-define=BUILD_NUMBER=${{ github.run_number }}

    - name: Package Windows build
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path build\artifacts | Out-Null
        $out = "build\artifacts\Selah-Windows-${{ needs.extract-version.outputs.app_version }}.zip"
        $p1 = 'build\windows\runner\Release'
        $p2 = 'build\windows\x64\runner\Release'
        if (Test-Path $p2) {
          Write-Host "Using $p2"
          Compress-Archive -Path "$p2\*" -DestinationPath $out -Force
        } elseif (Test-Path $p1) {
          Write-Host "Using $p1"
          Compress-Archive -Path "$p1\*" -DestinationPath $out -Force
        } else {
          Write-Error "Windows build output not found. Checked: $p1 and $p2"
          Get-ChildItem build -Recurse | Select-Object -First 50 | Format-Table
          exit 1
        }
        Get-ChildItem build\artifacts | Format-Table

    - name: Upload Windows to Release
      uses: softprops/action-gh-release@v1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        tag_name: v${{ needs.extract-version.outputs.app_version }}-build.${{ github.run_number }}
        name: Selah v${{ needs.extract-version.outputs.app_version }} - Build ${{ github.run_number }}
        draft: false
        prerelease: false
        files: build/artifacts/*
