name: Build Android
env:
  FLUTTER_VERSION: '3.41.9'
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number (optional)'
        required: false
        type: string
        default: ''

jobs:
  extract-version:
    name: Extract App Version
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.extract.outputs.app_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract app version
        id: extract
        run: |
          APP_VERSION=$(grep "final appVersion" lib/main.dart | sed 's/.*= "\(.*\)".*/\1/')
          echo "app_version=$APP_VERSION" >> $GITHUB_OUTPUT
          echo "📋 App version: $APP_VERSION"

  build-android:
    name: Build Android App
    needs: extract-version
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Cache Flutter dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.flutter-cache
          ~/.pub-cache
        key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}
        restore-keys: |
          ${{ runner.os }}-flutter-

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept Android licenses
      run: yes | flutter doctor --android-licenses

    - name: Clean build
      run: flutter clean

    - name: Get flutter dependencies
      run: flutter pub get


    - name: Create release keystore (for signing)
      run: |
        if [ -f android/app/selah-release.keystore ]; then
          echo "Keystore already exists"
        else
          echo "Generating selah-release.keystore for CI signing"
          keytool -genkeypair -v \
            -keystore android/app/selah-release.keystore \
            -storepass '2Samuel22:33' \
            -alias selah-key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keypass '2Samuel22:33' \
            -dname "CN=CI, OU=CI, O=Selah, L=CI, ST=CI, C=US"
        fi

    - name: Build Android APK
      run: |
        flutter build apk \
          --release \
          --target lib/main.dart \
          --dart-define=BUILD_NUMBER=${{ github.run_number }}

    - name: Rename APK artifact
      run: |
        mkdir -p build/artifacts
        cp build/app/outputs/flutter-apk/app-release.apk "build/artifacts/Selah-${{ needs.extract-version.outputs.app_version }}.apk"
        ls -lah build/artifacts/

    - name: Upload Android artifact
      uses: actions/upload-artifact@v4
      with:
        name: selah-android-${{ needs.extract-version.outputs.app_version }}-${{ github.run_number }}
        path: build/artifacts/*
        if-no-files-found: error
